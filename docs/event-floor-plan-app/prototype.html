<title>Event Floor Planner — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{
  --pine:#24382b; --pine-2:#2e4636; --accent:#d99a2b; --accent-ink:#7a5210;
  --bg:#e3ded0; --ground:#efebdd; --paper:#fbf9f1; --ink:#22271f; --ink-2:#6b6f60;
  --line:#d5d0bf; --wood:#c79e6b; --wood-edge:#9c7746;
  --tent-fill:#fffef8; --tent-edge:#8a9184; --wall:#5c6657; --window:#7fa8c9;
  --chair-basic:#a58358; --chair-basic-back:#7d5f3a;
  --chair-pad:#fbfaf6; --chair-pad-back:#d8d4c6; --chair-edge:#8f8b7c;
  --cloth-w:#faf9f4; --cloth-b:#2a2a2e; --grid1:rgba(60,70,50,.07); --grid5:rgba(60,70,50,.14);
  --danger:#b3402e; --sel:#d99a2b; --dim:#8b8f7e; --lights:#dfae3f;
  --floor:#e7d9c2; --floor-edge:#9a7f5c;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14170f; --ground:#1e221a; --paper:#262b21; --ink:#ece9dd; --ink-2:#a3a794;
  --line:#3a4033; --wood:#8f6f47; --wood-edge:#bf9a68;
  --tent-fill:#2c3126; --tent-edge:#79826f; --wall:#9aa48d; --window:#8fb6d6;
  --chair-basic:#8a6c44; --chair-basic-back:#5f4a2e;
  --chair-pad:#e8e5da; --chair-pad-back:#b9b5a6; --chair-edge:#6f7462;
  --cloth-w:#e9e7de; --cloth-b:#191a1d; --grid1:rgba(220,230,200,.06); --grid5:rgba(220,230,200,.12);
  --sel:#e6ad45; --accent:#e2a93f; --accent-ink:#f4d089; --danger:#e06a56; --dim:#7d8270; --lights:#e6b84e;
  --floor:#453a2b; --floor-edge:#b6996f;
}}
:root[data-theme="dark"]{
  --bg:#14170f; --ground:#1e221a; --paper:#262b21; --ink:#ece9dd; --ink-2:#a3a794;
  --line:#3a4033; --wood:#8f6f47; --wood-edge:#bf9a68;
  --tent-fill:#2c3126; --tent-edge:#79826f; --wall:#9aa48d; --window:#8fb6d6;
  --chair-basic:#8a6c44; --chair-basic-back:#5f4a2e;
  --chair-pad:#e8e5da; --chair-pad-back:#b9b5a6; --chair-edge:#6f7462;
  --cloth-w:#e9e7de; --cloth-b:#191a1d; --grid1:rgba(220,230,200,.06); --grid5:rgba(220,230,200,.12);
  --sel:#e6ad45; --accent:#e2a93f; --accent-ink:#f4d089; --danger:#e06a56; --dim:#7d8270; --lights:#e6b84e;
  --floor:#453a2b; --floor-edge:#b6996f;
}
:root[data-theme="light"]{
  --pine:#24382b; --pine-2:#2e4636; --accent:#d99a2b; --accent-ink:#7a5210;
  --bg:#e3ded0; --ground:#efebdd; --paper:#fbf9f1; --ink:#22271f; --ink-2:#6b6f60;
  --line:#d5d0bf; --wood:#c79e6b; --wood-edge:#9c7746;
  --tent-fill:#fffef8; --tent-edge:#8a9184; --wall:#5c6657; --window:#7fa8c9;
  --chair-basic:#a58358; --chair-basic-back:#7d5f3a;
  --chair-pad:#fbfaf6; --chair-pad-back:#d8d4c6; --chair-edge:#8f8b7c;
  --cloth-w:#faf9f4; --cloth-b:#2a2a2e; --grid1:rgba(60,70,50,.07); --grid5:rgba(60,70,50,.14);
  --danger:#b3402e; --sel:#d99a2b; --dim:#8b8f7e; --lights:#dfae3f;
  --floor:#e7d9c2; --floor-edge:#9a7f5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; justify-content:center; overflow:hidden;}
#app{width:100%; max-width:560px; height:100dvh; display:flex; flex-direction:column;
  background:var(--ground); box-shadow:0 0 40px rgba(0,0,0,.18); position:relative; overflow:hidden;}

header{background:var(--pine); color:#f2efe4; padding:10px 14px;
  display:flex; align-items:center; gap:10px; z-index:5; flex:0 0 auto;}
header .brand{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0;}
header .brand b{font-family:ui-rounded,-apple-system,sans-serif; font-size:16px; letter-spacing:.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
header .brand span{font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:#c9c39f;}
.chip{border:1px solid rgba(255,255,255,.28); color:#f2efe4; background:rgba(255,255,255,.08);
  border-radius:99px; font-size:12px; padding:6px 11px; font-weight:600; cursor:pointer;
  font-variant-numeric:tabular-nums;}
.iconb{width:32px; height:32px; border-radius:99px; border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#f2efe4; font-size:15px; line-height:1; cursor:pointer;
  display:grid; place-items:center; font-weight:700; flex:0 0 auto;}

#cvwrap{flex:1 1 auto; position:relative; overflow:hidden; touch-action:none; min-height:120px;}
svg#cv{display:block; width:100%; height:100%; touch-action:none; user-select:none;
  -webkit-user-select:none; -webkit-touch-callout:none;}
#zoomctl{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px;}
#zoomctl button, #tools button{width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:16px; font-weight:700; cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.12); display:grid; place-items:center; padding:0;}
#tools{position:absolute; left:10px; top:10px; display:grid;
  grid-template-columns:34px 34px; gap:6px;}
#tools button svg{width:17px; height:17px; display:block;}
#tools button.on{background:var(--accent); color:#241a05; border-color:var(--accent);}
#tools button:disabled{opacity:.35; cursor:default;}
#undoBtn, #redoBtn{font-size:18px; line-height:1;}
#multibar{position:absolute; left:50%; bottom:12px; transform:translateX(-50%) translateY(120%);
  display:flex; align-items:center; gap:4px; background:var(--pine); border-radius:14px;
  padding:6px 6px 6px 13px; box-shadow:0 5px 18px rgba(0,0,0,.32); z-index:9;
  transition:transform .2s; max-width:calc(100% - 20px);}
#multibar.on{transform:translateX(-50%) translateY(0);}
#mcount{color:#f2efe4; font-size:12.5px; font-weight:700; margin-right:5px; white-space:nowrap;
  font-variant-numeric:tabular-nums;}
#multibar button{border:0; background:rgba(255,255,255,.1); color:#f2efe4; font-size:14px;
  min-width:36px; height:34px; border-radius:9px; cursor:pointer; padding:0 9px; font-weight:700;}
#multibar button:disabled{opacity:.35;}
#multibar button.del{color:#f4a08f;}
#multibar button.done{background:var(--accent); color:#241a05; font-size:12.5px;}
#empty{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:90%; max-width:360px; text-align:center; pointer-events:none;}
#empty p{font-size:13px; line-height:1.5; color:var(--ink-2); margin:0 0 11px;}
#empty p b{color:var(--ink);}
#empty .exs{display:flex; flex-direction:column; gap:6px; pointer-events:auto;}
#empty .ex{border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:11px; padding:9px 12px; font-size:12.5px; line-height:1.35; cursor:pointer;
  text-align:left; box-shadow:0 2px 6px rgba(0,0,0,.07);}
#empty .ex b{color:var(--accent-ink); font-weight:700;}
#toast{position:absolute; left:50%; top:12px; transform:translateX(-50%) translateY(-8px);
  background:var(--pine); color:#f2efe4; font-size:12.5px; line-height:1.45; font-weight:600;
  padding:10px 14px; border-radius:13px; width:calc(100% - 24px); max-width:400px;
  box-shadow:0 4px 16px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; z-index:30;
  display:flex; align-items:center; gap:10px;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
#toastMsg{flex:1;}
#toastUndo{display:none; flex:0 0 auto; border:1px solid rgba(255,255,255,.35); background:transparent;
  color:var(--accent); font-weight:800; font-size:12px; padding:6px 11px; border-radius:99px; cursor:pointer;
  pointer-events:auto;}

#pill{position:absolute; display:none; gap:2px; background:var(--pine); border-radius:12px;
  padding:4px; box-shadow:0 4px 14px rgba(0,0,0,.3); z-index:8; transform:translate(-50%,-100%);}
#pill button{border:0; background:transparent; color:#f2efe4; font-size:14px; width:38px; height:34px;
  border-radius:9px; cursor:pointer; display:grid; place-items:center;}
#pill button:active{background:rgba(255,255,255,.14);}
#pill button.del{color:#f4a08f;}

#pbar{flex:0 0 auto; display:flex; gap:8px; align-items:center; padding:8px 12px;
  background:var(--paper); border-top:1px solid var(--line); z-index:5;}
#pin{flex:1; min-width:0; border:1px solid var(--line); background:var(--ground); color:var(--ink);
  border-radius:99px; padding:11px 15px; font-size:16px; outline:none; font-family:inherit;}
#pin::placeholder{color:var(--ink-2);}
#pin:focus{border-color:var(--accent); background:var(--paper);}
#prun{flex:0 0 auto; width:44px; height:44px; border-radius:99px; border:0; background:var(--pine);
  color:#f2efe4; font-size:18px; cursor:pointer;}
#prun:active{background:var(--pine-2);}
#shuffleBtn{flex:0 0 auto; width:44px; height:44px; border-radius:99px;
  border:1px solid var(--line); background:var(--ground); color:var(--ink);
  cursor:pointer; display:grid; place-items:center; padding:0;}
#shuffleBtn svg{width:19px; height:19px; display:block;}
#shuffleBtn:active{border-color:var(--accent); color:var(--accent-ink);}
#shuffleBtn:disabled{opacity:.35; cursor:default;}

#qbar{flex:0 0 auto; background:var(--pine); color:#f2efe4; display:flex; align-items:center; gap:12px;
  padding:9px 14px; cursor:pointer; z-index:5;}
#qbar .ql{flex:1; min-width:0;}
#qbar .ql small{display:block; font-size:10px; text-transform:uppercase; letter-spacing:1.3px; color:#c9c39f;}
#qbar .ql b{font-size:20px; color:var(--accent); font-variant-numeric:tabular-nums;
  font-family:ui-rounded,-apple-system,sans-serif;}
#qbar .ql b em{font-style:normal; font-size:11.5px; color:#dcd8c4; font-weight:500; margin-left:8px;}
#autob{flex:0 0 auto; border:0; border-radius:12px; background:var(--accent); color:#241a05; font-weight:800;
  font-size:13.5px; padding:10px 14px; cursor:pointer;}

#tray{flex:0 0 auto; background:var(--paper); border-top:1px solid var(--line);
  padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:5;}
#tray .row{display:flex; gap:8px; overflow-x:auto; padding:2px 12px 4px; scrollbar-width:none;}
#tray .row::-webkit-scrollbar{display:none;}
#tray .cap{font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--ink-2);
  padding:0 14px 5px; font-weight:700;}
.titem{flex:0 0 auto; border:1px solid var(--line); background:var(--ground); border-radius:12px;
  padding:7px 10px 6px; display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; min-width:74px;}
.titem:active{border-color:var(--accent);}
.titem svg{width:44px; height:26px;}
.titem b{font-size:11px; white-space:nowrap;}
.titem span{font-size:10.5px; color:var(--accent-ink); font-weight:700; font-variant-numeric:tabular-nums;}

#veil{position:absolute; inset:0; background:rgba(15,18,12,.45); opacity:0; pointer-events:none;
  transition:.22s; z-index:18;}
#veil.on{opacity:1; pointer-events:auto;}
.sheet{position:absolute; left:0; right:0; bottom:0; background:var(--paper);
  border-radius:18px 18px 0 0; transform:translateY(110%); visibility:hidden;
  transition:transform .26s cubic-bezier(.3,.9,.3,1), visibility 0s .26s;
  z-index:20; max-height:86%; display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.25);}
.sheet.on{transform:translateY(0); visibility:visible;
  transition:transform .26s cubic-bezier(.3,.9,.3,1), visibility 0s;}
.sheet .grab{width:38px; height:4px; border-radius:4px; background:var(--line); margin:9px auto 2px; flex:0 0 auto;}
.sheet .body{overflow-y:auto; padding:8px 16px calc(16px + env(safe-area-inset-bottom));}
.sheet h3{margin:6px 0 2px; font-size:17px; display:flex; align-items:baseline; gap:8px;}
.sheet h3 small{font-size:12px; color:var(--accent-ink); font-weight:700;}
.sheet .sub{font-size:12.5px; line-height:1.5; color:var(--ink-2); margin:0 0 10px;}
.seclbl{font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--ink-2);
  font-weight:700; margin:14px 0 6px;}
.mrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid var(--line);
  background:var(--ground); border-radius:12px; padding:11px 13px; font-size:14px; font-weight:600;
  color:var(--ink); cursor:pointer; margin-bottom:7px;}
.mrow .pr{margin-left:auto; font-size:11.5px; color:var(--ink-2); font-weight:600; font-variant-numeric:tabular-nums;}
.mrow.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--ground));}
.mrow.on .tick{color:var(--accent-ink); font-weight:800;}
.mrow .tick{width:16px; flex:0 0 auto; color:transparent;}
.mrow.danger{color:var(--danger);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.grid2 .mrow{margin-bottom:0;}
.seg{display:flex; gap:6px; flex-wrap:wrap;}
.seg .mrow{flex:1 1 auto; width:auto; justify-content:center; padding:10px 8px; font-size:13px;}
.seg .mrow .pr{margin-left:6px;}
.fld{display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--ground);
  border-radius:12px; padding:10px 13px; margin-bottom:7px; font-size:13px;}
.fld label{font-size:13px; font-weight:600; flex:1;}
.fld input{width:90px; border:0; background:transparent; color:var(--ink); font-size:16px; font-weight:700;
  text-align:right; outline:none; font-variant-numeric:tabular-nums; font-family:inherit;}
.cta{width:100%; border:0; border-radius:13px; background:var(--accent); color:#241a05; font-weight:800;
  font-size:15px; padding:14px; cursor:pointer; margin-top:12px;}
.ghost{width:100%; border:1px solid var(--line); border-radius:13px; background:transparent; color:var(--ink-2);
  font-weight:700; font-size:13px; padding:11px; cursor:pointer; margin-top:8px;}
.qline{display:flex; gap:8px; font-size:13.5px; padding:7px 0; border-bottom:1px dashed var(--line);
  align-items:baseline;}
.qline .qn{color:var(--ink-2); font-variant-numeric:tabular-nums; min-width:30px;}
.qline .qlab{flex:1;}
.qline .qp{font-variant-numeric:tabular-nums; font-weight:700;}
.qline .qp.na{color:var(--ink-2); font-weight:500; font-size:11.5px;}
.qtotal{display:flex; padding:12px 0 2px; font-size:16px; font-weight:800;}
.qtotal span:last-child{margin-left:auto; color:var(--accent-ink); font-size:19px;
  font-variant-numeric:tabular-nums;}
.qcat{margin-top:10px;}
.helpstep{display:flex; gap:11px; margin-bottom:12px; font-size:13.5px; line-height:1.5;}
.helpstep .n{flex:0 0 auto; width:22px; height:22px; border-radius:99px; background:var(--pine);
  color:#f2efe4; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:1px;}
.exlist{display:flex; flex-direction:column; gap:7px;}
.mrow.radio{align-items:center;}
.mrow.radio .tick{color:var(--ink-2); font-size:15px; width:18px;}
.mrow.radio.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--ground));}
.mrow.radio.on .tick{color:var(--accent-ink);}
.badge{font-style:normal; background:var(--accent); color:#241a05; font-size:9.5px; font-weight:800;
  padding:2px 6px; border-radius:99px; letter-spacing:.3px; text-transform:uppercase; margin-left:5px;}
.exhead{display:flex; align-items:baseline; gap:8px; font-size:14px; font-weight:600;
  margin:12px 0 5px;}
.exhead .pr{margin-left:auto; font-size:11.5px; color:var(--ink-2); font-weight:600;
  font-variant-numeric:tabular-nums;}
.sidepick{display:grid; gap:5px; justify-content:center; margin:2px 0 8px;
  grid-template-columns:16px var(--tw) 16px;
  grid-template-rows:16px var(--th) 16px;
  grid-template-areas:". n ." "w mid e" ". s .";}
.sidepick .mid{grid-area:mid; border:1px dashed var(--line); border-radius:6px;
  display:grid; place-items:center; font-size:11px; color:var(--ink-2);
  font-variant-numeric:tabular-nums;}
.sidepick .sb{border:1px solid var(--line); background:var(--ground); border-radius:5px;
  width:100%; height:100%; padding:0; cursor:pointer;}
.sidepick .sb.on{background:var(--wall); border-color:var(--wall);}
.sidepick .sb.windows.on{background:var(--window); border-color:var(--window);}
.sidepick .sb:active{border-color:var(--accent);}
.exlist button{border:1px solid var(--line); background:var(--ground); color:var(--ink); border-radius:12px;
  padding:11px 13px; font-size:13px; line-height:1.4; text-align:left; cursor:pointer; font-family:inherit;}
button:focus-visible,.titem:focus-visible,#pin:focus-visible{outline:2px solid var(--sel); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ .sheet,#veil,#toast{transition:none;} }
</style>

<div id="app">
  <header>
    <div class="brand"><b>Event Floor Planner</b><span>Prototype demo</span></div>
    <button class="chip" id="venueChip">40 × 60 ft ✎</button>
    <button class="iconb" id="helpBtn" aria-label="Demo guide">?</button>
  </header>

  <div id="cvwrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse">
          <path d="M1 0H0V1" fill="none" stroke="var(--grid1)" stroke-width=".04"/>
        </pattern>
        <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse">
          <path d="M5 0H0V5" fill="none" stroke="var(--grid5)" stroke-width=".07"/>
        </pattern>
      </defs>
      <g id="gVenue"></g>
      <g id="gTents"></g>
      <g id="gFloor"></g>
      <g id="gFurn"></g>
      <g id="gSel"></g>
    </svg>
    <div id="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Fit view" style="font-size:13px">⤢</button>
    </div>
    <div id="tools">
      <button id="undoBtn" aria-label="Undo" disabled>↶</button>
      <button id="redoBtn" aria-label="Redo" disabled>↷</button>
      <button id="selBtn" aria-label="Select multiple items"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2.2"/></svg></button>
      <button id="imgBtn" aria-label="Save plan as image"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v7.4"/><path d="m5 6.4 3 3 3-3"/><path d="M2.6 11.4v1.3a1.5 1.5 0 0 0 1.5 1.5h7.8a1.5 1.5 0 0 0 1.5-1.5v-1.3"/></svg></button>
    </div>
    <div id="empty">
      <p><b>Describe your event below</b> and the plan builds itself —<br>or tap an item in the tray to place it by hand.</p>
      <div class="exs" id="exs"></div>
    </div>
    <div id="pill">
      <button id="pRot" aria-label="Rotate">⟳</button>
      <button id="pDup" aria-label="Duplicate">⧉</button>
      <button id="pMenu" aria-label="Options">•••</button>
      <button id="pDel" class="del" aria-label="Delete">✕</button>
    </div>
    <div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
    <div id="multibar">
      <span id="mcount">Tap items to select</span>
      <button data-m="all">All</button>
      <button data-m="props" aria-label="Properties">•••</button>
      <button data-m="dup" aria-label="Duplicate selection">⧉</button>
      <button data-m="rot" aria-label="Rotate selection">⟳</button>
      <button data-m="del" class="del" aria-label="Delete selection">✕</button>
      <button data-m="done" class="done">Done</button>
    </div>
  </div>

  <div id="pbar">
    <button id="shuffleBtn" aria-label="Shuffle the arrangement" disabled><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 4.2h2.4l6 7.6h3.6"/><path d="M1.8 11.8h2.4l2.3-2.9"/><path d="M9.4 5.6l2.4-1.4h2"/><path d="m12.2 2.2 1.8 2-1.8 2"/><path d="m12.2 9.8 1.8 2-1.8 2"/></svg></button>
    <input id="pin" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="go"
           placeholder="Describe your event…" aria-label="Describe your event">
    <button id="prun" aria-label="Build the plan">✨</button>
  </div>

  <div id="qbar">
    <div class="ql"><small>Rental estimate</small><b id="qtot">$0</b></div>
    <button id="autob">Auto ✨</button>
  </div>

  <div id="tray">
    <div class="cap">Inventory — tap to place (real-size, no resizing)</div>
    <div class="row" id="trayRow"></div>
  </div>

  <div id="veil"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="body" id="sheetBody"></div></div>
</div>

<script>
"use strict";
/* ============ catalog ============ */
const CHAIRS = { basic:{name:"Basic chair", price:1.8}, padded:{name:"Padded white chair", price:3} };
const CAT = {
  t6:{name:"6 ft table", short:"6 ft", cat:"table", shape:"rect", w:6, h:2.5, price:8,  min:6, max:8},
  t8:{name:"8 ft table", short:"8 ft", cat:"table", shape:"rect", w:8, h:2.5, price:10, min:8, max:10},
  r5:{name:"5 ft round", short:"5 ft round", cat:"table", shape:"round", d:5, price:10, min:8, max:10},
  ck:{name:"Cocktail table", short:"cocktail", cat:"table", shape:"round", d:2.5, price:12, min:0, max:0, standing:true},
  tt1010:{name:"10×10 tent", size:"10×10", cat:"tent", w:10, h:10, price:75, extras:[
    {id:"lights", label:"String Lights", price:25},
    {id:"walls",  label:"Wall Kit",      price:15, perSide:true, sideLabel:"Wall panel"},
    {id:"ceil",   label:"Ceiling liner", price:null},
    {id:"legs",   label:"Leg liners",    price:null}]},
  tt1020:{name:"10×20 tent", size:"10×20", cat:"tent", w:20, h:10, price:150, extras:[
    {id:"lights", label:"String Lights", price:35},
    {id:"walls",  label:"Wall Kit",      price:15, perSide:true, sideLabel:"Wall panel"},
    {id:"ceil",   label:"Ceiling liner", price:null},
    {id:"legs",   label:"Leg liners",    price:null}]},
  tt2020:{name:"20×20 tent", size:"20×20", cat:"tent", w:20, h:20, price:350, extras:[
    {id:"lights",  label:"String Lights", price:55},
    {id:"walls",   label:"Side Walls",    price:25, perSide:true, sideLabel:"Side wall panel"},
    {id:"windows", label:"Windows",       price:35, perSide:true, sideLabel:"Window panel"},
    {id:"ceil",    label:"Ceiling liner", price:null},
    {id:"legs",    label:"Leg liners",    price:null}]},
};
/* Walls and windows are chosen per side, in the tent's own frame, so they
   rotate with it. A full set of four is billed as the listed kit price; a
   partial set is billed per panel at a quarter of it. */
const SIDES = ["n", "e", "s", "w"];
/* ---- dance floors ----
   Rental floors are built from 3 ft panels, so stocked sizes are multiples
   of 3. Sizing rule used across the industry, and the one this app follows:
   half the guests dance at once, each needing 3 sq ft. */
const DANCE = {share: 0.5, sqftPerDancer: 3};
const FLOOR_SIZES = [[9,12], [12,12], [12,15], [15,15], [18,18], [21,21]];
const FLOOR_KEYS = FLOOR_SIZES.map(([w,h]) => `df${w}x${h}`);
FLOOR_SIZES.forEach(([w,h]) => {
  CAT[`df${w}x${h}`] = {name:`${w}×${h} dance floor`, size:`${w}×${h}`, short:`${w}×${h} floor`,
                        cat:"floor", shape:"rect", w, h, price:null};
});
const floorArea = key => CAT[key].w * CAT[key].h;
const floorDancers = key => Math.floor(floorArea(key) / DANCE.sqftPerDancer);
const danceAreaFor = guests => Math.ceil(guests * DANCE.share * DANCE.sqftPerDancer);
function recommendFloor(guests){
  if (!guests) return null;
  const need = danceAreaFor(guests);
  return FLOOR_KEYS.find(k => floorArea(k) >= need) || FLOOR_KEYS[FLOOR_KEYS.length-1];
}
const sideSetOf = (it, id) => (it.props.sides && it.props.sides[id]) || {};
const sideCount = (it, id) => SIDES.filter(s => sideSetOf(it, id)[s]).length;
function setAllSides(it, id, on){
  if (!it.props.sides) it.props.sides = {};
  if (!it.props.sides[id]) it.props.sides[id] = {};
  SIDES.forEach(s => { it.props.sides[id][s] = on; });
}
const TRAY = ["r5","t6","t8","ck","dfPick","tt1010","tt1020","tt2020"];
const TENTS = ["tt1010","tt1020","tt2020"];

/* ============ state ============ */
let venue = {w:40, h:60};
let items = [];
let seq = 1;
let sel = new Set();
let selectMode = false;
let view = {x:-4, y:-4, w:48};

const $ = id => document.getElementById(id);
const cv = $("cv"), gT = $("gTents"), gD = $("gFloor"), gF = $("gFurn"), gS = $("gSel"), gV = $("gVenue");
const money = v => "$" + (Math.round(v*100)/100).toLocaleString("en-US",
  {minimumFractionDigits:(Math.round(v*100)%100 ? 2 : 0), maximumFractionDigits:2});
const deg = r => r*180/Math.PI;

function newItem(k, x, y){
  const c = CAT[k];
  let props = {};
  if (c.cat === "table") props = {chairs:0, ctype:"basic", cloth:"none"};
  else if (c.cat === "tent"){
    props = {extras:{}, sides:{}};
    c.extras.filter(e => e.perSide).forEach(e => {
      props.sides[e.id] = {n:false, e:false, s:false, w:false};
    });
  }
  return {id:seq++, k, x, y, rot:0, props};
}
/* ============ history (undo / redo) ============
   commit() is called BEFORE any mutation and stores the pre-change state. */
const HISTORY_MAX = 60;
let past = [], future = [];
const snapState = () => JSON.stringify({items, seq, venue});
function restore(s){
  const o = JSON.parse(s);
  const venueChanged = o.venue.w !== venue.w || o.venue.h !== venue.h;
  items = o.items; seq = o.seq; venue = o.venue;
  sel.clear();
  $("venueChip").textContent = `${venue.w} × ${venue.h} ft ✎`;
  render();
  if (venueChanged) fitView(items.length > 0);
  historyUI();
}
function historyUI(){
  $("undoBtn").disabled = !past.length;
  $("redoBtn").disabled = !future.length;
}
function commit(){
  past.push(snapState());
  if (past.length > HISTORY_MAX) past.shift();
  future.length = 0;
  historyUI();
}
function undo(){
  if (!past.length) return false;
  future.push(snapState());
  restore(past.pop());
  return true;
}
function redo(){
  if (!future.length) return false;
  past.push(snapState());
  restore(future.pop());
  return true;
}
/* undo the last commit without leaving a redo step (used when an action aborts) */
function rollback(){ if (past.length) restore(past.pop()); }

/* ============ chair layout ============ */
function chairSpots(c, n){
  const s = 1.4, off = 0.32, out = [];
  if (!n) return out;
  if (c.shape === "round"){
    const r = c.d/2 + off + s/2;
    for (let i=0; i<n; i++){
      const a = i/n * 2*Math.PI - Math.PI/2;
      const x = r*Math.cos(a), y = r*Math.sin(a);
      out.push({x, y, rot: deg(Math.atan2(-y, -x)) - 90});
    }
  } else {
    const sideCap = Math.floor(c.w/2);
    const ends = Math.max(0, Math.min(2, n - 2*sideCap));
    const side = n - ends, top = Math.ceil(side/2), bot = side - top;
    const yTop = -(c.h/2 + off + s/2), yBot = -yTop;
    const place = (cnt, y, rot) => {
      const span = Math.min(c.w - 1.4, cnt*2);
      for (let i=0; i<cnt; i++)
        out.push({x: cnt===1 ? 0 : -span/2 + i*span/(cnt-1), y, rot});
    };
    place(top, yTop, 0); place(bot, yBot, 180);
    if (ends >= 1) out.push({x:-(c.w/2+off+s/2), y:0, rot:90});
    if (ends === 2) out.push({x:(c.w/2+off+s/2), y:0, rot:-90});
  }
  return out;
}

/* ============ svg ============ */
function chairSVG(sp, type){
  const f = type==="padded" ? "var(--chair-pad)" : "var(--chair-basic)";
  const b = type==="padded" ? "var(--chair-pad-back)" : "var(--chair-basic-back)";
  return `<g transform="translate(${sp.x} ${sp.y}) rotate(${sp.rot})">
    <rect x="-.7" y="-.7" width="1.4" height="1.4" rx=".34" fill="${f}" stroke="var(--chair-edge)" stroke-width=".06"/>
    <rect x="-.62" y="-.68" width="1.24" height=".34" rx=".16" fill="${b}"/></g>`;
}
function tableSVG(it){
  const c = CAT[it.k], p = it.props;
  const fill = p.cloth==="white" ? "var(--cloth-w)" : p.cloth==="black" ? "var(--cloth-b)" : "var(--wood)";
  const edge = p.cloth==="black" ? "#000" : "var(--wood-edge)";
  let s = "";
  if (!c.standing) chairSpots(c, p.chairs).forEach(sp => s += chairSVG(sp, p.ctype));
  if (c.shape === "round"){
    s += `<circle r="${c.d/2}" fill="${fill}" stroke="${edge}" stroke-width=".1"/>`;
    s += c.standing ? `<circle r=".22" fill="${edge}" opacity=".55"/>`
                    : `<circle r="${c.d/2-.6}" fill="none" stroke="${edge}" stroke-width=".05" opacity=".4"/>`;
  } else {
    s += `<rect x="${-c.w/2}" y="${-c.h/2}" width="${c.w}" height="${c.h}" rx=".18" fill="${fill}" stroke="${edge}" stroke-width=".1"/>
          <line x1="${-c.w/2+.5}" y1="0" x2="${c.w/2-.5}" y2="0" stroke="${edge}" stroke-width=".05" opacity=".4"/>`;
  }
  return `<g data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">${s}</g>`;
}
function tentSVG(it){
  const c = CAT[it.k], ex = it.props.extras, hw = c.w/2, hh = c.h/2;
  let s = `<rect x="${-hw}" y="${-hh}" width="${c.w}" height="${c.h}" rx=".25" fill="var(--tent-fill)" stroke="var(--tent-edge)" stroke-width=".14"/>`;
  if (c.w === c.h){
    s += `<path d="M${-hw} ${-hh} L0 0 M${hw} ${-hh} L0 0 M${-hw} ${hh} L0 0 M${hw} ${hh} L0 0" stroke="var(--tent-edge)" stroke-width=".07" opacity=".45" fill="none"/>`;
  } else {
    const q = c.w/4;
    s += `<path d="M${-hw} ${-hh} L${-q} 0 M${-hw} ${hh} L${-q} 0 M0 ${-hh} L${-q} 0 M0 ${hh} L${-q} 0
                 M${hw} ${-hh} L${q} 0 M${hw} ${hh} L${q} 0 M0 ${-hh} L${q} 0 M0 ${hh} L${q} 0
                 M${-q} 0 L${q} 0" stroke="var(--tent-edge)" stroke-width=".07" opacity=".45" fill="none"/>`;
  }
  if (ex.ceil) s += `<rect x="${-hw+.55}" y="${-hh+.55}" width="${c.w-1.1}" height="${c.h-1.1}" rx=".2" fill="var(--cloth-w)" opacity=".35"/>`;
  /* per-side walls and windows, in the tent's own frame */
  const edges = {
    n: [-hw, -hh,  hw, -hh],
    e: [ hw, -hh,  hw,  hh],
    s: [-hw,  hh,  hw,  hh],
    w: [-hw, -hh, -hw,  hh],
  };
  const walls = sideSetOf(it, "walls"), wins = sideSetOf(it, "windows");
  for (const sd of SIDES){
    const [x1,y1,x2,y2] = edges[sd];
    if (walls[sd])
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--wall)" stroke-width=".42" stroke-linecap="square"/>`;
    if (wins[sd])
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--window)" stroke-width="${walls[sd] ? .24 : .3}" stroke-dasharray="1.3 1.7" stroke-linecap="butt"/>`;
  }
  if (ex.lights) s += `<rect x="${-hw+1.1}" y="${-hh+1.1}" width="${c.w-2.2}" height="${c.h-2.2}" rx=".3" fill="none" stroke="var(--lights)" stroke-width=".2" stroke-dasharray=".01 .85" stroke-linecap="round"/>`;
  if (ex.legs){
    const pts = c.w===c.h ? [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]]
                          : [[-hw,-hh],[0,-hh],[hw,-hh],[-hw,hh],[0,hh],[hw,hh]];
    pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r=".42" fill="var(--cloth-w)" stroke="var(--tent-edge)" stroke-width=".08"/>`);
  }
  s += `<text y="${hh-.7}" text-anchor="middle" font-size="1.1" fill="var(--tent-edge)" opacity=".8" style="pointer-events:none">${c.size}</text>`;
  return `<g data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">${s}</g>`;
}
function floorSVG(it){
  const c = CAT[it.k], hw = c.w/2, hh = c.h/2;
  let s = `<rect x="${-hw}" y="${-hh}" width="${c.w}" height="${c.h}" rx=".15"
    fill="var(--floor)" stroke="var(--floor-edge)" stroke-width=".14"/>`;
  for (let x = -hw+3; x < hw-0.01; x += 3)
    s += `<line x1="${x}" y1="${-hh}" x2="${x}" y2="${hh}" stroke="var(--floor-edge)" stroke-width=".05" opacity=".55"/>`;
  for (let y = -hh+3; y < hh-0.01; y += 3)
    s += `<line x1="${-hw}" y1="${y}" x2="${hw}" y2="${y}" stroke="var(--floor-edge)" stroke-width=".05" opacity=".55"/>`;
  s += `<text y=".45" text-anchor="middle" font-size="1.2" fill="var(--floor-edge)" opacity=".9" style="pointer-events:none">${c.size} dance floor</text>`;
  return `<g data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">${s}</g>`;
}
function render(){
  gV.innerHTML =
    `<rect width="${venue.w}" height="${venue.h}" fill="var(--ground)"/>
     <rect width="${venue.w}" height="${venue.h}" fill="url(#g1)"/>
     <rect width="${venue.w}" height="${venue.h}" fill="url(#g5)"/>
     <rect width="${venue.w}" height="${venue.h}" fill="none" stroke="var(--dim)" stroke-width=".16"/>
     <text x="${venue.w/2}" y="-1" text-anchor="middle" font-size="1.5" fill="var(--dim)">${venue.w} ft</text>
     <text x="-1" y="${venue.h/2}" text-anchor="middle" font-size="1.5" fill="var(--dim)" transform="rotate(-90 -1 ${venue.h/2})">${venue.h} ft</text>`;
  gT.innerHTML = items.filter(i => CAT[i.k].cat==="tent").map(tentSVG).join("");
  gD.innerHTML = items.filter(i => CAT[i.k].cat==="floor").map(floorSVG).join("");
  gF.innerHTML = items.filter(i => CAT[i.k].cat==="table").map(tableSVG).join("");
  renderSel(); renderQuote();
  $("empty").style.display = items.length ? "none" : "block";
  $("shuffleBtn").disabled = !items.some(i => CAT[i.k].cat === "table");
}
function itemBox(it){
  const c = CAT[it.k];
  const hw = c.shape==="round" ? c.d/2 : c.w/2;
  const hh = c.shape==="round" ? c.d/2 : c.h/2;
  const a = it.rot*Math.PI/180, ca = Math.abs(Math.cos(a)), sa = Math.abs(Math.sin(a));
  return {x0: it.x-(hw*ca+hh*sa), y0: it.y-(hw*sa+hh*ca),
          x1: it.x+(hw*ca+hh*sa), y1: it.y+(hw*sa+hh*ca)};
}
function selOutline(it){
  const c = CAT[it.k];
  const shape = c.shape==="round"
    ? `<circle r="${c.d/2+.5}" fill="none"/>`
    : `<rect x="${-c.w/2-.5}" y="${-c.h/2-.5}" width="${c.w+1}" height="${c.h+1}" rx=".3" fill="none"/>`;
  return `<g transform="translate(${it.x} ${it.y}) rotate(${it.rot})">${shape}</g>`;
}
let marquee = null;
function renderSel(){
  const chosen = items.filter(i => sel.has(i.id));
  let s = chosen.map(selOutline).join("");
  if (marquee){
    const x = Math.min(marquee.x0, marquee.x1), y = Math.min(marquee.y0, marquee.y1);
    s += `<rect x="${x}" y="${y}" width="${Math.abs(marquee.x1-marquee.x0)}" height="${Math.abs(marquee.y1-marquee.y0)}" fill="none"/>`;
  }
  gS.innerHTML = s
    ? `<g stroke="var(--sel)" stroke-width=".14" stroke-dasharray=".5 .35" style="pointer-events:none">${s}</g>`
    : "";
  const multi = selectMode || chosen.length > 1;
  $("pill").style.display = (!multi && chosen.length === 1) ? "flex" : "none";
  if (!multi && chosen.length === 1) positionPill(chosen[0]);
  const mb = $("multibar");
  mb.classList.toggle("on", multi);
  if (multi){
    $("mcount").textContent = chosen.length
      ? `${chosen.length} selected` : "Tap items to select";
    mb.querySelectorAll("[data-m]").forEach(b => {
      if (b.dataset.m === "done" || b.dataset.m === "all") return;
      b.disabled = b.dataset.m === "props" ? chosen.length !== 1 : !chosen.length;
    });
  }
}
function positionPill(it){
  const r = cv.getBoundingClientRect(), wr = $("cvwrap").getBoundingClientRect();
  const c = CAT[it.k], hh = (c.shape==="round" ? c.d/2 : Math.max(c.w,c.h)/2);
  const px = (it.x - view.x)/view.w * r.width + r.left - wr.left;
  const py = (it.y - hh - 1.2 - view.y)/viewH()*r.height + r.top - wr.top;
  const p = $("pill");
  p.style.display = "flex";
  p.style.left = Math.max(70, Math.min(wr.width-70, px)) + "px";
  p.style.top  = Math.max(46, py) + "px";
}
function viewH(){ const r = cv.getBoundingClientRect(); return view.w * r.height / (r.width||1); }
function applyView(){
  cv.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${viewH()}`);
  const it = items.find(i => sel.has(i.id)); if (it && sel.size===1) positionPill(it);
}
function contentBounds(){
  if (!items.length) return null;
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for (const it of items){
    const c = CAT[it.k];
    const seats = c.cat==="table" && it.props.chairs ? 2.1 : 0;
    const r = (c.cat==="tent" ? Math.max(c.w,c.h)/2
            : c.shape==="round" ? c.d/2 : Math.max(c.w,c.h)/2) + seats;
    x0 = Math.min(x0, it.x-r); x1 = Math.max(x1, it.x+r);
    y0 = Math.min(y0, it.y-r); y1 = Math.max(y1, it.y+r);
  }
  return {x0, y0, x1, y1};
}
function fitView(toContent){
  const r = cv.getBoundingClientRect(), ar = (r.height||1)/(r.width||1);
  const b = toContent ? contentBounds() : null;
  const m = b ? 3 : 4;
  const bx = b ? b.x0-m : -m, by = b ? b.y0-m : -m;
  const bw = b ? (b.x1-b.x0)+2*m : venue.w+2*m;
  const bh = b ? (b.y1-b.y0)+2*m : venue.h+2*m;
  let w = Math.max(bw, bh/ar, 12);
  view = {x: bx + bw/2 - w/2, y: by + bh/2 - (w*ar)/2, w};
  applyView();
}

/* ============ quote ============ */
function quoteLines(){
  const cats = {Tents:[], "Tent extras":[], "Dance floor":[], Tables:[], Chairs:[], Linens:[]};
  const push = (cat, label, unit, qty=1) => {
    const arr = cats[cat], f = arr.find(l => l.label===label && l.unit===unit);
    f ? f.qty += qty : arr.push({label, unit, qty});
  };
  for (const it of items){
    const c = CAT[it.k];
    if (c.cat === "floor"){
      push("Dance floor", `${c.size} dance floor (${floorArea(it.k)} sq ft)`, c.price);
    } else if (c.cat === "tent"){
      push("Tents", c.name, c.price);
      for (const ex of c.extras){
        if (ex.perSide){
          const n = sideCount(it, ex.id);
          if (n === 4) push("Tent extras", `${ex.label} (${c.size}) — all 4 sides`, ex.price);
          else if (n > 0) push("Tent extras", `${ex.sideLabel} (${c.size})`, ex.price/4, n);
        } else if (it.props.extras[ex.id]){
          push("Tent extras", `${ex.label} (${c.size})`, ex.price);
        }
      }
    } else {
      push("Tables", c.name, c.price);
      if (it.props.chairs && !c.standing)
        push("Chairs", CHAIRS[it.props.ctype].name, CHAIRS[it.props.ctype].price, it.props.chairs);
      if (it.props.cloth !== "none")
        push("Linens", `Spandex ${it.props.cloth} tablecloth`, 0);
    }
  }
  let total = 0, onReq = false;
  for (const k in cats) for (const l of cats[k]){
    if (l.unit == null) onReq = true; else total += l.unit * l.qty;
  }
  return {cats, total, onReq};
}
function renderQuote(){
  const q = quoteLines();
  const chairs = items.reduce((n,i) => n + (CAT[i.k].cat==="table" ? i.props.chairs : 0), 0);
  const bits = [];
  if (items.length) bits.push(items.length + " item" + (items.length>1?"s":""));
  if (chairs) bits.push(chairs + " seats");
  $("qtot").innerHTML = money(q.total) +
    (bits.length ? `<em>${bits.join(" · ")} · tap for details</em>` : "");
}

/* ============ toast ============ */
let toastT;
function toast(msg, opts={}){
  const t = $("toast");
  $("toastMsg").innerHTML = msg;
  $("toastUndo").style.display = opts.undo ? "block" : "none";
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), opts.ms || (opts.undo ? 7000 : 3600));
}
$("toastUndo").addEventListener("click", () => {
  $("toast").classList.remove("on");
  if (undo()) toast("Reverted — use ↷ to put it back", {ms:2600});
});

/* ============ sheets ============ */
let sheetMode = null;
function openSheet(html, mode){
  sheetMode = mode; $("sheetBody").innerHTML = html;
  $("sheet").classList.add("on"); $("veil").classList.add("on");
  $("pill").style.display = "none";
}
function closeSheet(){
  sheetMode = null; $("sheet").classList.remove("on"); $("veil").classList.remove("on");
  renderSel();
}
$("veil").addEventListener("click", closeSheet);

/* ---- dance floor size picker (radio list, sized from the guest count) ---- */
const seatTotal = () => items.reduce((n,i) => n + (CAT[i.k].cat==="table" ? i.props.chairs : 0), 0);
let dfGuests = null;                     // sticky guest count for the picker
function floorPickerHTML(mode, curKey){
  const guests = dfGuests != null ? dfGuests : (seatTotal() || 0);
  const rec = recommendFloor(guests);
  const need = danceAreaFor(guests);
  const rows = FLOOR_KEYS.map(k => {

/* Drop a new item where it does not land on what is already placed. */
function findClearSpot(key, x0, y0){
  const others = items.filter(i => CAT[i.k].cat !== "tent")
    .map(i => occupancy(i.k, i.props.chairs || 0, {x:i.x, y:i.y, rot:i.rot}));
  const clear = (x, y) => others.every(o => clearBetween(occupancy(key, 0, {x, y, rot:0}), o) >= 1);
  if (clear(x0, y0)) return {x:x0, y:y0};
  for (let r = 3; r <= 72; r += 3)
    for (let a = 0; a < 12; a++){
      const x = Math.round(x0 + r*Math.cos(a*Math.PI/6));
      const y = Math.round(y0 + r*Math.sin(a*Math.PI/6));
      if (clear(x, y)) return {x, y};
    }
  return {x:x0, y:y0};
}
function menuFor(id){

$("sheetBody").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act, val = btn.dataset.val;
  if (act==="floorAdd"){
    commit();
    const at = findClearSpot(val, Math.round(view.x + view.w/2), Math.round(view.y + viewH()/2));
    const it = newItem(val, at.x, at.y);
    items.push(it); sel = new Set([it.id]); render(); closeSheet();
    toast(`${CAT[val].size} dance floor added — ${floorArea(val)} sq ft, about ${floorDancers(val)} dancers`, {undo:true});
    return;
  }
  if (act==="floorSize" && sheetMode && sheetMode.type==="floor"){
    const it = items.find(i => i.id===sheetMode.id); if (!it) return closeSheet();
    if (it.k !== val){ commit(); it.k = val; render(); }
    $("sheetBody").innerHTML = sheetMode.menu ? floorMenuHTML(it, CAT[it.k]) : floorPickerHTML("edit", it.k);
    return;
  }
  if (sheetMode && sheetMode.type==="floor" && sheetMode.menu){
    const it = items.find(i => i.id===sheetMode.id); if (!it) return closeSheet();
    if (act==="dup"){ duplicate(it); closeSheet(); return; }
    if (act==="rot"){ commit(); it.rot = (it.rot + 90) % 360; render(); return; }
    if (act==="del"){ commit(); items = items.filter(i => i!==it); sel.clear(); render(); closeSheet(); return; }
  }
  if (sheetMode && (sheetMode.type==="table" || sheetMode.type==="tent")){
    const it = items.find(i => i.id===sheetMode.id); if (!it) return closeSheet();
    const c = CAT[it.k];
    if (act==="dup"){ duplicate(it); closeSheet(); return; }
    commit();
    if (act==="rot"){ it.rot = (it.rot + (c.cat==="tent"?90:45)) % 360; render(); return; }
    if (act==="del"){ items = items.filter(i => i!==it); sel.clear(); render(); closeSheet(); return; }
    if (act==="chmin"){ it.props.chairs = c.min; if (it.props.ctype==="none") it.props.ctype="basic"; }
    if (act==="chmax"){ it.props.chairs = c.max; if (it.props.ctype==="none") it.props.ctype="basic"; }
    if (act==="ctype"){ if (val==="none") it.props.chairs = 0;
                        else { it.props.ctype = val; if (!it.props.chairs) it.props.chairs = c.min; } }
    if (act==="cloth"){ it.props.cloth = val; }
    if (act==="extra"){ it.props.extras[val] = !it.props.extras[val]; }
    if (act==="side"){
      const [id, sd] = val.split(":");
      if (!it.props.sides) it.props.sides = {};
      if (!it.props.sides[id]) it.props.sides[id] = {};
      it.props.sides[id][sd] = !it.props.sides[id][sd];
    }
    if (act==="sideAll"){
      const [id, on] = val.split(":");
      setAllSides(it, id, on === "1");
    }
    render();
    $("sheetBody").innerHTML = c.cat==="table" ? tableMenuHTML(it,c) : tentMenuHTML(it,c);
    return;
  }
  if (act==="venuePreset"){
    const [w,h] = val.split("x").map(Number); setVenue(w,h); return;
  }
  if (act==="venueSave"){
    const w = +$("vW").value, h = +$("vD").value;
    if (w>=15 && h>=15 && w<=300 && h<=300) setVenue(w,h);
    else toast("Enter 15–300 ft per side");
    return;
  }
  if (act==="saveImg"){ saveImage(); return; }
  if (act==="autoRun"){ runAuto(); return; }
  if (act==="segpick"){
    btn.parentElement.querySelectorAll(".mrow").forEach(b => b.classList.remove("on"));
    btn.classList.add("on"); return;
  }
  if (act==="reqQuote"){ toast("In the real app this sends your layout + quote straight to the rental team 🎉", {ms:4200}); return; }
  if (act==="clearAll"){ commit(); items=[]; sel.clear(); render(); closeSheet(); toast("Canvas cleared", {undo:true}); return; }
  if (act==="tryex"){ closeSheet(); runPrompt(btn.dataset.ex); return; }
});

function resolveVars(str){
  const cs = getComputedStyle(document.documentElement);
  return str.replace(/var\((--[a-z0-9-]+)\)/g, (m, v) => cs.getPropertyValue(v).trim() || "#000");
}
function planSVG(){
  const W = 1100, pad = 44;
  const b = contentBounds();
  const x0 = Math.min(0, b ? b.x0 : 0) - 3, y0 = Math.min(0, b ? b.y0 : 0) - 3;
  const x1 = Math.max(venue.w, b ? b.x1 : venue.w) + 3, y1 = Math.max(venue.h, b ? b.y1 : venue.h) + 3;
  const fw = x1-x0, fh = y1-y0;
  const s = (W - pad*2) / fw, drawH = fh * s;
  const q = quoteLines();
  const lines = [];
  for (const cat in q.cats) for (const l of q.cats[cat])
    lines.push(`${l.qty}×  ${l.label}` + (l.unit==null ? "  (on request)" : l.unit===0 ? "  (incl.)" : `  ${money(l.unit*l.qty)}`));
  const cols = 2, rows = Math.ceil(lines.length/cols);
  const headH = 104, footH = 34 + rows*25 + 58;
  const H = headH + drawH + footH;
  const date = new Date().toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"});
  const seats = items.reduce((n,i) => n + (CAT[i.k].cat==="table" ? i.props.chairs : 0), 0);

  const plan = items.filter(i => CAT[i.k].cat==="tent").map(tentSVG).join("")
             + items.filter(i => CAT[i.k].cat==="floor").map(floorSVG).join("")
             + items.filter(i => CAT[i.k].cat==="table").map(tableSVG).join("");
  const legend = lines.map((txt, i) => {
    const c = i % cols, r = Math.floor(i/cols);
    return `<text x="${pad + c*(W-pad*2)/cols}" y="${headH+drawH+58 + r*25}" font-size="16" fill="var(--ink-2)"
      font-family="-apple-system,Helvetica,Arial,sans-serif">${txt.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</text>`;
  }).join("");

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Math.round(H)}" viewBox="0 0 ${W} ${Math.round(H)}">
  <defs>
    <pattern id="eg" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M5 0H0V5" fill="none" stroke="var(--grid5)" stroke-width="${1/s}"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="var(--paper)"/>
  <text x="${pad}" y="44" font-size="27" font-weight="700" fill="var(--ink)" font-family="-apple-system,Helvetica,Arial,sans-serif">Event floor plan</text>
  <text x="${pad}" y="72" font-size="16" fill="var(--ink-2)" font-family="-apple-system,Helvetica,Arial,sans-serif">${venue.w} × ${venue.h} ft · ${items.length} items${seats ? " · " + seats + " seats" : ""} · ${date}</text>
  <text x="${W-pad}" y="50" text-anchor="end" font-size="30" font-weight="800" fill="var(--accent-ink)" font-family="-apple-system,Helvetica,Arial,sans-serif">${money(q.total)}</text>
  <text x="${W-pad}" y="72" text-anchor="end" font-size="13" fill="var(--ink-2)" letter-spacing="1.2" font-family="-apple-system,Helvetica,Arial,sans-serif">ESTIMATE${q.onReq ? " (EXCL. ON-REQUEST)" : ""}</text>
  <g transform="translate(${pad} ${headH}) scale(${s}) translate(${-x0} ${-y0})">
    <rect width="${venue.w}" height="${venue.h}" fill="var(--ground)"/>
    <rect width="${venue.w}" height="${venue.h}" fill="url(#eg)"/>
    <rect width="${venue.w}" height="${venue.h}" fill="none" stroke="var(--dim)" stroke-width="${2/s}"/>
    ${plan}
  </g>
  <g transform="translate(${pad} ${headH+drawH+24})">
    <line x1="0" y1="0" x2="${10*s}" y2="0" stroke="var(--ink-2)" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="var(--ink-2)" stroke-width="2"/>
    <line x1="${10*s}" y1="-5" x2="${10*s}" y2="5" stroke="var(--ink-2)" stroke-width="2"/>
    <text x="${10*s+12}" y="5" font-size="15" fill="var(--ink-2)" font-family="-apple-system,Helvetica,Arial,sans-serif">10 ft</text>
  </g>
  ${legend}
  <text x="${pad}" y="${H-20}" font-size="13" fill="var(--dim)" font-family="-apple-system,Helvetica,Arial,sans-serif">Drawn to scale · tables and tents shown at real size · Event Floor Planner</text>
</svg>`;
}
let lastPNG = null;
let dlCap = null;
if (typeof claude !== "undefined" && claude && typeof claude.use === "function")
  claude.use("downloads").then(d => { dlCap = d; }).catch(() => {});

function saveImage(){
  const blob = sheetMode && sheetMode.blob;
  if (!blob) return;
  const name = "event-floor-plan.png";
  if (dlCap){
    dlCap.save({filename:name, data:blob})
      .then(() => toast("Image saved"))
      .catch(err => {
        if (err && err.code === "declined") return;
        toast("Couldn’t save here — press and hold the image above to save it instead.", {ms:4500});
      });
    return;
  }
  if (navigator.canShare && sheetMode.file && navigator.canShare({files:[sheetMode.file]})){
    navigator.share({files:[sheetMode.file], title:"Event floor plan"}).catch(() => {});
    return;
  }
  const a = document.createElement("a");
  a.href = lastPNG; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportImage(){
  if (!items.length) return toast("Nothing to save yet — build a plan first.");
  const root = document.documentElement, prev = root.getAttribute("data-theme");
  root.setAttribute("data-theme", "light");
  const svg = resolveVars(planSVG());
  prev ? root.setAttribute("data-theme", prev) : root.removeAttribute("data-theme");

  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const cnv = document.createElement("canvas");
    cnv.width = img.width*scale; cnv.height = img.height*scale;
    const ctx = cnv.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    cnv.toBlob(blob => {
      if (lastPNG) URL.revokeObjectURL(lastPNG);
      lastPNG = URL.createObjectURL(blob);
      const file = new File([blob], "event-floor-plan.png", {type:"image/png"});
      openSheet(`<h3>Your floor plan</h3>
        <p class="sub">To scale, with the itemized estimate baked in — ready to send to the rental team.</p>
        <img src="${lastPNG}" alt="Floor plan" style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">
        <button class="cta" data-act="saveImg">Save image</button>
        <p class="sub" style="margin-top:10px">On iPhone you can also press and hold the image above and choose <b>Add to Photos</b>.</p>`,
        {type:"image", file, blob});
    }, "image/png");
  };
  img.onerror = () => toast("Couldn’t render the image on this browser.");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

    if (Math.abs(it.x - t.x) <= c.w/2 && Math.abs(it.y - t.y) <= c.h/2) return t;
  }
  return null;
}
/* Every arrangement that can be laid out cleanly for the current plan. */
function arrangementsFor(groups, fixed){
  const ok = [];
  for (const pat of PATTERNS){
    const plan = [];
    let usable = true;
    for (const g of groups){
      const f = latticeFor(g.area, g.list);
      if (!f){ usable = false; break; }
      const ctx = {same: f.same, key: g.list[0].k, chairs: g.list[0].props.chairs, list: g.list};
      const pos = pat.gen(g.area, f, g.list.length, ctx);
      if (!validArrangement(pos, g.list, g.area, fixed, pat.touch ? 0 : null)){ usable = false; break; }
      plan.push({list: g.list, pos});
    }
    if (usable && plan.length) ok.push({pat, plan});

}
let arrangeIdx = 0;
function shuffleLayout(){
  const tables = items.filter(i => CAT[i.k].cat === "table");

  const tents = items.filter(i => CAT[i.k].cat === "tent");

    for (const t of tents){
      const list = tables.filter(x => tentHolding(x, tents) === t);
      if (list.length) groups.push({area: areaOfTent(t), list});
    }

    if (!groups.length)
      return toast("These tables are outside the tents — drag them inside to rearrange them.", {ms:4200});
  } else {

  }

    .concat(items.filter(i => CAT[i.k].cat === "floor")
                 .map(it => occupancy(it.k, 0, {x:it.x, y:it.y, rot:it.rot})));

  const options = arrangementsFor(groups, fixed);
  if (!options.length)
    return toast("No other arrangement fits this space cleanly — try a bigger tent or fewer tables.", {ms:4200});
  if (options.length === 1)
    return toast(`Only one arrangement fits these tables at proper spacing — <b>${options[0].pat.name}</b>.`, {ms:3800});

  arrangeIdx = (arrangeIdx + 1) % options.length;
  const pick = options[arrangeIdx];
  commit();
  for (const {list, pos} of pick.plan)
    list.forEach((it, i) => { it.x = pos[i].x; it.y = pos[i].y; it.rot = pos[i].rot; });

        `${staying.length ? ` · ${staying.length} table${staying.length>1?"s":""} outside the tent left in place` : ""}</span>`,
