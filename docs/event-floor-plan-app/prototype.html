/* ============ accommodation guidelines ============
   Real event-planning clearances, in feet. "lane" is the CLEAR FLOOR left
   between whatever occupies the space — a chair back on one side and a chair
   back or table edge on the other. Chairs are therefore never allowed to
   overlap: the worst case the engine will produce is the smallest lane below.
   Clearance is directional, because a banquet table only seats guests on its
   long sides unless it is set to MAX. */
const SPACING = {
  chairDepth: 1.72,   // table edge → back of a pulled-out chair
  perim:      0.75,   // tent leg line → nearest chair back / table edge
  perimOpen:  2.5,    // canvas edge → nearest chair back, with no tent
  seated:   { ideal: 1.5, lanes: [3, 2.5, 2, 1.5, 1, 0.75, 0.5] },
  standing: { ideal: 2,   lanes: [3, 2.5, 2, 1.5, 1] },
};
const rulesFor = (key, chairs) => (CAT[key].standing || !chairs) ? SPACING.standing : SPACING.seated;
/* Clearance a table needs beyond its own footprint, per axis, at rotation 0. */
function padsFor(key, chairs){
  const c = CAT[key];
  if (c.standing || !chairs) return {x:0, y:0};
  if (c.shape === "round") return {x:SPACING.chairDepth, y:SPACING.chairDepth};
  const ends = chairs > 2*Math.floor(c.w/2);      // MAX seating adds chairs at the ends
  return {x: ends ? SPACING.chairDepth : 0, y: SPACING.chairDepth};
}
function halfExtent(key, chairs){
  const c = CAT[key], p = padsFor(key, chairs);
  const half = c.shape==="round" ? c.d/2 : Math.max(c.w, c.h)/2;
  return half + Math.max(p.x, p.y);
}

/* ============ packing ============ */
function fitFor(W, H, key, count, chairs){
  const c = CAT[key], R = rulesFor(key, chairs), p = padsFor(key, chairs);
  const dims = c.shape==="round"
    ? [{w:c.d, h:c.d, px:p.x, py:p.y, rot:0}]
    : [{w:c.w, h:c.h, px:p.x, py:p.y, rot:0},
       {w:c.h, h:c.w, px:p.y, py:p.x, rot:90}];
  let best = null;
  for (const lane of R.lanes) for (const d of dims){
    const ow = d.w + 2*d.px, oh = d.h + 2*d.py;   // footprint including chairs
    if (ow > W || oh > H) continue;
    const nx = Math.floor((W + lane) / (ow + lane));
    const ny = Math.floor((H + lane) / (oh + lane));
    if (nx < 1 || ny < 1) continue;
    const cand = {nx, ny, px: ow + lane, py: oh + lane, rot:d.rot, cap:nx*ny, lane};
    if (!best || cand.cap > best.cap) best = cand;
    if (cand.cap >= count) return cand;
  }
  return best || {nx:0, ny:0, px:1, py:1, rot:0, cap:0, lane:R.lanes[R.lanes.length-1]};
}
function fitInTent(tentKey, tableKey, count, chairs){
  const c = CAT[tentKey], m = 2*SPACING.perim;
  return fitFor(c.w - m, c.h - m, tableKey, count, chairs);
}
/* Guests a tent seats at proper spacing — used for guidance copy. */
function tentSeats(tentKey, tableKey){
  const per = CAT[tableKey].min || 0;
  return fitInTent(tentKey, tableKey, 999, per).cap * per;
}
function placeGrid(cx, cy, fit, count){
  const out = [], rows = Math.max(1, Math.ceil(count/Math.max(1, fit.nx)));
  for (let r=0; r<rows; r++){
    const inRow = Math.min(fit.nx, count - r*fit.nx);
    if (inRow <= 0) break;
    const y = cy - (rows-1)*fit.py/2 + r*fit.py;
    for (let i=0; i<inRow; i++)
      out.push({x: cx - (inRow-1)*fit.px/2 + i*fit.px, y, rot: fit.rot});
  }
  return out;
}

/* ============ configuration guidelines ============
   How a party planner lays a room out, encoded as arrangement patterns.
   Principles, in priority order:
     1. Nothing overlaps. Chair clearance (§SPACING) is never negotiable.
     2. Centre the arrangement in its tent, so it reads as deliberate.
     3. Keep the middle open when people will dance — ring the seating.
     4. Give guests sightlines: offset rows beat dead-straight ones.
     5. Aisles are continuous straight lanes, not leftover space.
     6. Partial rows are centred, never left-aligned.
     7. Long joined tables suit small groups; rounds suit large ones.
   Every generated arrangement is validated against rule 1 before it is
   offered, so a pattern that cannot be done cleanly is simply not shown. */

function occupancy(key, chairs, pos){
  const c = CAT[key], p = padsFor(key, chairs);
  if (c.shape === "round") return {round:true, x:pos.x, y:pos.y, r: c.d/2 + p.x};
  const rot = ((pos.rot % 180) + 180) % 180;
  const swap = rot > 45 && rot < 135;
  return {round:false, x:pos.x, y:pos.y,
          hw: ((swap ? c.h : c.w) + 2*(swap ? p.y : p.x))/2,
          hh: ((swap ? c.w : c.h) + 2*(swap ? p.x : p.y))/2};
}
function clearBetween(a, b){
  if (a.round && b.round) return Math.hypot(a.x-b.x, a.y-b.y) - a.r - b.r;
  const ah = a.round ? {hw:a.r, hh:a.r} : a, bh = b.round ? {hw:b.r, hh:b.r} : b;
  return Math.max(Math.abs(a.x-b.x) - ah.hw - bh.hw,
                  Math.abs(a.y-b.y) - ah.hh - bh.hh);
}
/* A candidate arrangement is valid only if every table sits inside the area,
   no two are closer than the clearance floor, and none collides with an item
   that is staying put (`fixed`). */
function validArrangement(pos, list, area, fixed, minClear){
  if (!pos || pos.length !== list.length) return false;
  const occ = pos.map((p, i) => occupancy(list[i].k, list[i].props.chairs, p));
  /* Default floor is the comfort lane. Patterns whose tables are MEANT to
     meet (a feasting run, a U-shape) pass 0: touching is fine, overlapping
     never is — the occupied box already includes each chair's depth. */
  const floorLane = (minClear != null ? minClear
                    : SPACING.seated.lanes[SPACING.seated.lanes.length-1]) - 0.05;
  for (let i=0; i<occ.length; i++){
    const a = occ[i], hw = a.round ? a.r : a.hw, hh = a.round ? a.r : a.hh;
    if (a.x-hw < area.cx-area.w/2-0.05 || a.x+hw > area.cx+area.w/2+0.05) return false;
    if (a.y-hh < area.cy-area.h/2-0.05 || a.y+hh > area.cy+area.h/2+0.05) return false;
    for (let j=i+1; j<occ.length; j++)
      if (clearBetween(a, occ[j]) < floorLane) return false;
    for (const f of (fixed || []))
      if (clearBetween(a, f) < floorLane) return false;
  }
  return true;
}
/* The lattice a pattern positions tables on. */
function latticeFor(area, list){
  const first = list[0];
  const same = list.every(i => i.k === first.k && i.props.chairs === first.props.chairs);
  if (same){
    const fit = fitFor(area.w, area.h, first.k, list.length, first.props.chairs);
    return fit.cap >= list.length ? Object.assign({same:true}, fit) : null;
  }
  let ow = 0, oh = 0;
  for (const it of list){
    const o = occupancy(it.k, it.props.chairs, {x:0, y:0, rot:0});
    ow = Math.max(ow, o.round ? 2*o.r : 2*o.hw);
    oh = Math.max(oh, o.round ? 2*o.r : 2*o.hh);
  }
  for (const lane of SPACING.seated.lanes){
    const px = ow + lane, py = oh + lane;
    const nx = Math.floor((area.w + lane)/px), ny = Math.floor((area.h + lane)/py);
    if (nx >= 1 && ny >= 1 && nx*ny >= list.length)
      return {nx, ny, px, py, rot:0, cap:nx*ny, lane, same:false};
  }
  return null;
}
const latticeSlot = (area, f, ix, iy) => ({
  x: area.cx - (f.nx-1)*f.px/2 + ix*f.px,
  y: area.cy - (f.ny-1)*f.py/2 + iy*f.py, rot: f.rot });

/* ---- the patterns ---- */
function patGrid(area, f, n){ return placeGrid(area.cx, area.cy, f, n); }

function patStagger(area, f, n){
  if (f.nx < 2) return null;
  const rows = Math.ceil(n / f.nx);
  if (rows < 2) return null;
  const out = [];
  let left = n;
  for (let r = 0; r < rows && left > 0; r++){
    const inRow = Math.min(f.nx, left);
    const y = area.cy - (rows-1)*f.py/2 + r*f.py;
    const off = (r % 2 ? 1 : -1) * f.px/4;
    for (let i = 0; i < inRow; i++)
      out.push({x: area.cx - (inRow-1)*f.px/2 + i*f.px + off, y, rot: f.rot});
    left -= inRow;
  }
  return out;
}

function patPerimeter(area, f, n){
  if (f.nx < 2 || f.ny < 2) return null;
  const ring = [];
  for (let ix=0; ix<f.nx; ix++)        ring.push(latticeSlot(area, f, ix, 0));
  for (let iy=1; iy<f.ny; iy++)        ring.push(latticeSlot(area, f, f.nx-1, iy));
  for (let ix=f.nx-2; ix>=0; ix--)     ring.push(latticeSlot(area, f, ix, f.ny-1));
  for (let iy=f.ny-2; iy>=1; iy--)     ring.push(latticeSlot(area, f, 0, iy));
  if (n > ring.length) return null;
  const out = [];
  for (let i=0; i<n; i++) out.push(ring[Math.floor(i*ring.length/n)]);
  return out;
}

function patAisle(area, f, n, ctx){
  if (n < 4) return null;
  const aisle = 4;                       // a real processional lane
  const half = (area.w - aisle)/2;
  if (half < f.px) return null;
  const nL = Math.ceil(n/2), nR = n - nL;
  const build = (cx, count) => {
    const sub = {cx, cy: area.cy, w: half, h: area.h};
    const sf = ctx.same
      ? fitFor(half, area.h, ctx.key, count, ctx.chairs)
      : latticeFor(sub, ctx.list.slice(0, count));
    if (!sf || sf.cap < count) return null;
    return placeGrid(cx, area.cy, sf, count);
  };
  const L = build(area.cx - aisle/2 - half/2, nL);
  const R = nR ? build(area.cx + aisle/2 + half/2, nR) : [];
  return (L && R) ? L.concat(R) : null;
}

function patLong(area, f, n, ctx){       // tables joined end to end
  if (!ctx.same) return null;
  const c = CAT[ctx.key];
  if (c.shape !== "rect" || c.standing) return null;
  if (ctx.chairs > 2*Math.floor(c.w/2)) return null;   // end seats block the join
  const horiz = area.w >= area.h;
  const runs = [1, 2];                   // one long table, or two parallel runs
  for (const lines of runs){
    const per = Math.ceil(n / lines);
    const runLen = per * c.w;
    const out = [];
    if (horiz){
      if (runLen > area.w) continue;
      const spanY = lines === 1 ? 0 : (c.h + 2*SPACING.chairDepth + SPACING.seated.ideal);
      if ((lines-1)*spanY + c.h > area.h) continue;
      let placed = 0;
      for (let l = 0; l < lines; l++){
        const y = area.cy - (lines-1)*spanY/2 + l*spanY;
        const count = Math.min(per, n - placed);
        for (let i = 0; i < count; i++)
          out.push({x: area.cx - (count*c.w)/2 + c.w/2 + i*c.w, y, rot: 0});
        placed += count;
      }
    } else {
      if (runLen > area.h) continue;
      const spanX = lines === 1 ? 0 : (c.h + 2*SPACING.chairDepth + SPACING.seated.ideal);
      if ((lines-1)*spanX + c.h > area.w) continue;
      let placed = 0;
      for (let l = 0; l < lines; l++){
        const x = area.cx - (lines-1)*spanX/2 + l*spanX;
        const count = Math.min(per, n - placed);
        for (let i = 0; i < count; i++)
          out.push({x, y: area.cy - (count*c.w)/2 + c.w/2 + i*c.w, rot: 90});
        placed += count;
      }
    }
    if (out.length === n) return out;
  }
  return null;
}

function patU(area, f, n, ctx){           // head table with two arms
  if (!ctx.same || n < 3) return null;
  const c = CAT[ctx.key];
  if (c.shape !== "rect" || c.standing) return null;
  if (ctx.chairs > 2*Math.floor(c.w/2)) return null;
  const maxHead = Math.floor(area.w / c.w);
  for (let head = Math.min(maxHead, n-2); head >= 1; head--){
    const arms = n - head, perArm = Math.ceil(arms/2);
    const headW = head*c.w;
    const topY = area.cy - area.h/2 + c.h/2 + SPACING.chairDepth;
    const startY = topY + c.h/2 + SPACING.chairDepth + SPACING.seated.ideal + c.w/2;
    if (startY + (perArm-1)*c.w + c.w/2 + SPACING.chairDepth > area.cy + area.h/2) continue;
    const out = [];
    for (let i=0; i<head; i++)
      out.push({x: area.cx - headW/2 + c.w/2 + i*c.w, y: topY, rot: 0});
    const lx = area.cx - headW/2 + c.h/2 + SPACING.chairDepth;
    const rx = area.cx + headW/2 - c.h/2 - SPACING.chairDepth;
    for (let i=0; i<arms; i++){
      const idx = Math.floor(i/2);
      out.push({x: i % 2 ? rx : lx, y: startY + idx*c.w, rot: 90});
    }
    return out;
  }
  return null;
}

const PATTERNS = [
  {id:"grid",      name:"Banquet grid",   blurb:"even rows — the most seats in the space",          gen:patGrid},
  {id:"stagger",   name:"Staggered rows", blurb:"offset rows open up sightlines",                   gen:patStagger},
  {id:"perimeter", name:"Open centre",    blurb:"seating rings the tent, middle free for dancing",  gen:patPerimeter},
  {id:"aisle",     name:"Centre aisle",   blurb:"two blocks with a processional lane between",      gen:patAisle},
  {id:"long",      name:"Feasting table", blurb:"tables joined end to end, family style",           gen:patLong, touch:true},
  {id:"ushape",    name:"U-shape",        blurb:"head table with two arms, everyone facing in",     gen:patU,    touch:true},
];
function distribute(total, n, cap){
  const out = Array(n).fill(0);
  let left = Math.min(total, n*cap), i = 0;
  while (left > 0){ if (out[i%n] < cap){ out[i%n]++; left--; } i++; }
  return out;
}

/* ============ natural-language prompt ============ */
const NUMW = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,dozen:12,fifteen:15,twenty:20,twentyfive:25,thirty:30,forty:40,fifty:50,
  sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const num = s => s==null ? null : (/^\d+$/.test(s) ? +s : (NUMW[s] ?? null));

function parsePrompt(raw){
  let t = " " + raw.toLowerCase()
    .replace(/[’´]/g, "'")
    .replace(/[×✕]/g, "x")
    .replace(/[,;.!?:]/g, " ")
    .replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|dozen|fifteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)\b/g, w => NUMW[w])
    .replace(/(\d+)\s*(?:''|"|inch(?:es)?\b|in\b)/g, (m,d) => (+d>=48 ? "5ft " : " "))
    .replace(/(\d+)\s*(?:'|ft\b|foot\b|feet\b|footer[s]?\b)/g, "$1ft")
    .replace(/\s+/g, " ") + " ";

  const spec = {venue:null, tents:[], tentSize:null, tentCount:0, tables:[], chairs:null,
                chairType:null, cloth:null, extras:{}, guests:null, floor:false, floorKey:null,
                notes:[], any:false};
  const neg = i => /\b(no|without|skip|minus)\s+[\w\s]{0,12}$/.test(t.slice(Math.max(0,i-20), i));

  /* --- tent extras (stripped so they can't confuse table parsing) --- */
  const strip = re => { t = t.replace(re, " "); };
  const findEx = (re, key) => {
    const m = re.exec(t);
    if (m && !neg(m.index)){ spec.extras[key] = true; spec.any = true; }
    if (m) strip(re);
  };
  findEx(/\b(?:string|bistro|cafe|fairy|edison|market|globe|twinkle)\s*light\w*\b/, "lights");
  findEx(/\b(?:ceiling|roof)\s*lin\w*\b/, "ceil");
  findEx(/\b(?:leg|pole)\s*(?:lin\w*|drap\w*|cover\w*|wrap\w*)\b/, "legs");
  findEx(/\bwindows?\b/, "windows");
  findEx(/\b(?:side\s*walls?|wall\s*kits?|walls?|sidewalls?)\b/, "walls");
  findEx(/\b(?:lights|lighting)\b/, "lights");

  /* --- venue --- */
  const vm = /(\d+)\s*(?:ft)?\s*x\s*(\d+)\s*(?:ft)?\s*(?:yard|backyard|lot|venue|space|area|patio|lawn|garden|driveway|room|hall|field|site)/.exec(t);
  if (vm){ spec.venue = {w:+vm[1], h:+vm[2]}; spec.any = true; strip(new RegExp(vm[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))); }

  /* --- dance floor --- */
  const dfm = /(?:(\d+)\s*(?:ft)?\s*x\s*(\d+)\s*(?:ft)?\s*)?\b(?:dance\s*floor|dancefloor|dancing\s*area)\b/.exec(t);
  if (dfm && !neg(dfm.index)){
    spec.any = true;
    spec.floor = true;
    if (dfm[1]){
      const w = +dfm[1], h = +dfm[2];
      const exact = FLOOR_KEYS.find(k => (CAT[k].w===w && CAT[k].h===h) || (CAT[k].w===h && CAT[k].h===w));
      if (exact) spec.floorKey = exact;
      else {
        const need = w*h;
        spec.floorKey = FLOOR_KEYS.find(k => floorArea(k) >= need) || FLOOR_KEYS[FLOOR_KEYS.length-1];
        spec.notes.push(`We stock ${FLOOR_SIZES.map(s=>s.join("×")).join(", ")} — used ${CAT[spec.floorKey].size} for the ${w}×${h} you asked for.`);
      }
    }
    t = t.replace(dfm[0], " ");
  }

  /* --- tents --- */
  const addTent = (w, h, n) => {
    const a = Math.max(w,h), b = Math.min(w,h);
    let key = a<=10 && b<=10 ? "tt1010" : (a<=20 && b<=10) ? "tt1020" : (a<=20 && b<=20) ? "tt2020" : null;
    if (!key){
      const n2 = Math.max(1, Math.round((a*b)/400)) * (n||1);
      spec.notes.push(`We stock 10×10, 10×20 and 20×20 — used ${n2} × 20×20 for the ${w}×${h} you asked for.`);
      for (let i=0; i<n2; i++) spec.tents.push("tt2020");
      return;
    }
    for (let i=0; i<(n||1); i++) spec.tents.push(key);
  };
  const DIM = String.raw`(\d+)\s*(?:ft)?\s*x\s*(\d+)\s*(?:ft)?`;
  const CNT = String.raw`(?:(\d+|an?)\s+)?`;
  const collect = pattern => {
    const rx = new RegExp(pattern, "g"), out = [];
    let mm;
    while ((mm = rx.exec(t))) out.push({txt:mm[0], n:num(mm[1]) || 1, w:+mm[2], h:+mm[3]});
    out.forEach(o => { t = t.replace(o.txt, " "); });
    return out;
  };
  const tRaw = t;
  let hits = collect(CNT + DIM + String.raw`\s*(?:pop\s*up\s*|canopy\s*|frame\s*|party\s*)?tents?\b`)
    .concat(collect(CNT + String.raw`tents?\b\s*(?:of\s*|sized?\s*|at\s*|-\s*)?` + DIM));
  hits.forEach(h => addTent(h.w, h.h, h.n));
  // trailing multiplier: "20x20 tent x 2"
  const mult = /tents?\s*x\s*(\d+)\b/.exec(tRaw);
  if (mult && spec.tents.length === 1){
    const k = spec.tents[0];
    for (let i = 1; i < +mult[1]; i++) spec.tents.push(k);
  }
  if (spec.tents.length) spec.any = true;
  // bare "a tent" / "2 tents" with no size given
  if (!spec.tents.length && /\btents?\b|\bcanopy\b|\bcovered\b/.test(t) && !neg(t.search(/\btents?\b/))){
    spec.tentAuto = true; spec.any = true;
    const tc = /(\d+|an?)\s+tents?\b/.exec(t);
    spec.tentCount = num(tc && tc[1]) || 1;
  }

  /* --- tables --- */
  const tablePats = [
    [/(?:(\d+|[a-z]+)\s+)?(?:5ft\s*)?\brounds?\b(?:\s*tables?)?/g, "r5"],
    [/(?:(\d+|[a-z]+)\s+)?6ft\s*(?:banquet\s*|rectangular?\s*|long\s*)?(?:tables?|rectangles?)?/g, "t6"],
    [/(?:(\d+|[a-z]+)\s+)?8ft\s*(?:banquet\s*|rectangular?\s*|long\s*)?(?:tables?|rectangles?)?/g, "t8"],
    [/(?:(\d+|[a-z]+)\s+)?\b(?:cocktail|highboy|high\s*top|hightop|bistro|standing)\b\s*(?:tables?)?/g, "ck"],
    [/(?:(\d+|[a-z]+)\s+)?\b(?:banquet|rectangular|rectangle|long)\b\s*tables?/g, "t6"],
  ];
  for (const [rx, key] of tablePats){
    let mm;
    while ((mm = rx.exec(t))){
      const n = num(mm[1]);
      spec.tables.push({key, n});
      spec.any = true;
    }
  }
  if (!spec.tables.length){
    const gm = /(?:(\d+|[a-z]+)\s+)?\btables?\b/.exec(t);
    if (gm){ spec.tables.push({key:"r5", n:num(gm[1])}); spec.any = true; }
  }

  /* --- chairs --- */
  const cm = /(?:(\d+|[a-z]+)\s+)?(?:(padded|white padded|cushioned|basic|folding|plastic|resin|garden|white|black)\s+)?chairs?\b/.exec(t);
  if (cm){
    spec.any = true;
    if (/\b(?:no|without|zero)\s+(?:\w+\s+)?chairs?\b/.test(t)) spec.chairs = 0;
    else {
      spec.chairs = num(cm[1]);
      if (cm[2]) spec.chairType = /pad|cushion/.test(cm[2]) ? "padded"
                                : /basic|folding|plastic|resin|garden/.test(cm[2]) ? "basic" : null;
    }
  }
  if (!spec.chairType){
    if (/\bpadded\b|\bcushion\w*\b/.test(t)) spec.chairType = "padded";
    else if (/\bbasic\b|\bfolding\b|\bplastic\b|\bresin\b/.test(t)) spec.chairType = "basic";
  }
  if (spec.chairType) spec.any = true;
  if (/\bseating\s+for\s+(\d+)/.test(t) && spec.chairs == null)
    spec.chairs = +/\bseating\s+for\s+(\d+)/.exec(t)[1];

  /* --- linens --- */
  const lm = /\b(white|black|ivory|cream)?\s*(?:spandex\s*)?(?:table\s*cloths?|tablecloths?|linens?|table\s*covers?)\b/.exec(t)
          || /\b(?:spandex)\s*(white|black)\b/.exec(t)
          || /\b(white|black)\s+spandex\b/.exec(t);
  if (lm){
    const col = lm[1];
    spec.cloth = col==="black" ? "black" : "white";
    if (col==="ivory" || col==="cream") spec.notes.push("Spandex comes in white or black — used white.");
    spec.any = true;
  }

  /* --- guests --- */
  const gm2 = /(\d+|[a-z]+)\s*(?:guests?|people|persons?|attendees?|pax|seats?|kids?)\b/.exec(t)
           || /\bfor\s+(\d+)\b/.exec(t);
  if (gm2 && num(gm2[1]) != null){ spec.guests = num(gm2[1]); spec.any = true; }

  return spec;
}

/* --- modify-in-place mode: prompt only mentions properties --- */
function isModifyOnly(spec){
  return items.length > 0 && !spec.tents.length && !spec.tentAuto && !spec.tables.length
      && spec.guests == null && spec.venue == null
      && (Object.keys(spec.extras).length || spec.cloth || spec.chairType || spec.chairs != null);
}
/* Apply a prompt-level extra to a tent. Per-side extras go on all four sides;
   the side picker is how you pare them back. */
function applyExtraToTent(tent, key){
  const c = CAT[tent.k];
  const ex = c.extras.find(e => e.id === key);
  if (!ex) return false;
  if (ex.perSide) setAllSides(tent, key, true);
  else tent.props.extras[key] = true;
  return true;
}
function applyModify(spec){
  commit();
  const said = [];
  const tents = items.filter(i => CAT[i.k].cat==="tent");
  const tables = items.filter(i => CAT[i.k].cat==="table" && !CAT[i.k].standing);
  for (const key in spec.extras){
    let hit = 0;
    for (const t of tents) if (applyExtraToTent(t, key)) hit++;
    if (hit){
      const ex = CAT[tents[0].k].extras.find(e => e.id === key);
      said.push(ex ? (ex.perSide ? `${ex.label} on all 4 sides` : ex.label) : key);
    }
  }
  if (spec.cloth){ tables.forEach(t => t.props.cloth = spec.cloth); if (tables.length) said.push(`spandex ${spec.cloth} linens`); }
  if (spec.chairType){ tables.forEach(t => { t.props.ctype = spec.chairType; if (!t.props.chairs) t.props.chairs = CAT[t.k].min; });
    if (tables.length) said.push(CHAIRS[spec.chairType].name.toLowerCase() + "s"); }
  if (spec.chairs != null && tables.length){
    const per = distribute(spec.chairs, tables.length, Math.max(...tables.map(t => CAT[t.k].max)));
    tables.forEach((t,i) => t.props.chairs = Math.min(per[i], CAT[t.k].max));
    said.push(`${spec.chairs} seats`);
  }
  render();
  if (!said.length) return toast("Nothing on the canvas to change — try describing the full setup instead.");
  toast(`Updated: ${said.join(" · ")} — ${money(quoteLines().total)}`, {undo:true});
}

/* --- build a full plan from a spec --- */
function applySpec(spec){
  commit();
  const notes = spec.notes.slice();
  const readback = [];

  if (spec.venue){ venue = {w:spec.venue.w, h:spec.venue.h}; readback.push(`${venue.w}×${venue.h} ft space`); }

  /* table list */
  let tableKey = spec.tables.length ? spec.tables[0].key : "r5";
  let tableCount = 0;
  const explicit = spec.tables.filter(x => x.n != null);
  if (spec.tables.length){
    tableCount = spec.tables.reduce((n,x) => n + (x.n || 0), 0);
    if (!explicit.length) tableCount = 0;
  }
  const seatCap = CAT[tableKey].min || CAT[tableKey].max;
  if (!tableCount){
    const basis = spec.chairs || spec.guests;
    tableCount = basis && seatCap ? Math.ceil(basis/seatCap) : (spec.tables.length ? 1 : 0);
    if (!tableCount && (spec.tents.length || spec.tentAuto)) tableCount = 0;
  }

  /* chairs per table drives the clearance rules (banquet ends only seat at MAX) */
  const estChairs = spec.chairs != null ? spec.chairs
                  : spec.guests != null ? spec.guests
                  : (spec.chairType ? tableCount * (CAT[tableKey].min || 0) : 0);
  const perTable = CAT[tableKey].standing || !tableCount ? 0
                 : Math.min(CAT[tableKey].max, Math.ceil(estChairs / tableCount));
  const RULES = rulesFor(tableKey, perTable);

  /* tents */
  let tents = spec.tents.slice();
  if (!tents.length && spec.tentAuto){
    const want = Math.max(1, spec.tentCount || 1);
    if (!tableCount){
      tents = Array(want).fill("tt1020");   // nothing to size against — neutral middle size
    } else {
      const per = Math.ceil(tableCount / want) || 1;
      const pick = TENTS.find(k => fitInTent(k, tableKey, per, perTable).cap >= per);
      if (pick) tents = Array(want).fill(pick);
      else {
        const capBig = Math.max(1, fitInTent("tt2020", tableKey, tableCount, perTable).cap);
        tents = Array(Math.max(want, Math.ceil(tableCount/capBig))).fill("tt2020");
      }
    }
    /* a dance floor needs its own covered space — dining tent plus dancing tent */
    if (spec.floor && tableCount) tents.push(tents[tents.length-1]);
  }

  /* pack tents into rows, then grow the canvas to hold them */
  const rowsOf = (keys, maxW) => {
    const out = []; let row = [], w = 0;
    for (const k of keys){
      const tw = CAT[k].w;
      if (row.length && w + tw > maxW){ out.push({keys:row, w}); row = []; w = 0; }
      row.push(k); w += tw;
    }
    if (row.length) out.push({keys:row, w});
    return out;
  };
  let pack = [], packH = [], totalW = 0, totalH = 0;
  const repack = () => {
    pack = rowsOf(tents, venue.w);
    packH = pack.map(r => Math.max(...r.keys.map(k => CAT[k].h)));
    totalW = Math.max(...pack.map(r => r.w));
    totalH = packH.reduce((a,b) => a+b, 0);
  };
  const growTo = (w, h, why) => {
    const nw = Math.max(venue.w, Math.ceil(w/5)*5), nh = Math.max(venue.h, Math.ceil(h/5)*5);
    if (nw !== venue.w || nh !== venue.h){
      venue = {w:nw, h:nh};
      if (why && !notes.some(n => n.startsWith("Canvas grown")))
        notes.push(`Canvas grown to ${nw}×${nh} ft ${why}`);
      return true;
    }
    return false;
  };
  if (tents.length){
    repack();
    if (growTo(totalW + 8, totalH + 8, "to hold the tents.")) repack();
  }

  items = []; seq = 1; sel.clear();

  /* where each tent lands */
  const tentPos = [];
  if (tents.length){
    let y = venue.h/2 - totalH/2;
    for (let r = 0; r < pack.length; r++){
      let x = venue.w/2 - pack[r].w/2;
      for (const k of pack[r].keys){
        tentPos.push({k, cx: x + CAT[k].w/2, cy: y + packH[r]/2});
        x += CAT[k].w;
      }
      y += packH[r];
    }
  }

  /* the dance floor takes the last tent — the dancing tent — or the centre
     of the canvas when there is no tent at all */
  let floorItem = null, floorOcc = null;
  const floorTentIdx = tents.length ? tents.length - 1 : -1;
  if (spec.floor){
    const guestsForFloor = spec.guests != null ? spec.guests
                         : (spec.chairs != null ? spec.chairs
                         : tableCount * (CAT[tableKey].min || 0));
    const key = spec.floorKey || recommendFloor(guestsForFloor) || FLOOR_KEYS[1];
    const at = floorTentIdx >= 0 ? tentPos[floorTentIdx] : {cx: venue.w/2, cy: venue.h/2};
    floorItem = newItem(key, at.cx, at.cy);
    floorOcc = occupancy(key, 0, {x:at.cx, y:at.cy, rot:0});
    if (!spec.floorKey && guestsForFloor)
      notes.push(`${CAT[key].size} dance floor sized for ${Math.round(guestsForFloor*DANCE.share)} dancers — half of ${guestsForFloor} at 3 sq ft each.`);
  }

  /* place tents, then tables inside them at proper clearance */
  const slots = [];
  let tight = false, overflow = 0;
  if (tents.length){
    /* with more than one tent, the dancing tent holds no tables */
    const hostIdx = tentPos.map((_, i) => i)
      .filter(i => !(spec.floor && i === floorTentIdx && tentPos.length > 1));
    let remaining = tableCount, hostsDone = 0;
    for (let i = 0; i < tentPos.length; i++){
      const tp = tentPos[i], c = CAT[tp.k];
      const tent = newItem(tp.k, tp.cx, tp.cy);
      for (const key in spec.extras) applyExtraToTent(tent, key);
      items.push(tent);
      if (!hostIdx.includes(i)) continue;
      hostsDone++;
      if (remaining <= 0) continue;
      const share = Math.ceil(remaining / (hostIdx.length - hostsDone + 1));
      const fit = fitInTent(tp.k, tableKey, share, perTable);
      const n = Math.min(share, fit.cap);
      if (n && fit.lane < RULES.ideal) tight = true;
      /* if the dance floor shares this tent, ring the tables around it */
      const sharesFloor = floorOcc && Math.abs(floorOcc.x - tp.cx) < c.w/2
                                   && Math.abs(floorOcc.y - tp.cy) < c.h/2;
      let put = null;
      if (sharesFloor){
        const area = areaOfTent(tent);
        for (const cand of [patPerimeter(area, fit, n), placeGrid(tp.cx, tp.cy, fit, n)]){
          if (!cand) continue;
          const keep = cand.filter(p => clearBetween(occupancy(tableKey, perTable, p), floorOcc) >= 1);
          if (keep.length === n){ put = cand; break; }
          if (!put || keep.length > put.length) put = keep;
        }
      }
      put = put || placeGrid(tp.cx, tp.cy, fit, n);
      put.forEach(p => slots.push(p));
      remaining -= put.length;
    }
    /* whatever cannot be seated inside at proper clearance goes OUTSIDE,
       below the tents, rather than crowding chairs together */
    if (remaining > 0){
      overflow = remaining;
      const half = halfExtent(tableKey, perTable);
      const rowY = venue.h/2 + totalH/2 + half + 2;
      const fit = fitFor(venue.w - 2*SPACING.perimOpen, half*2 + 0.1, tableKey, remaining, perTable);
      const nx = Math.max(1, fit.nx);
      const rows = Math.ceil(remaining / nx);
      growTo(venue.w, rowY + (rows-1)*fit.py + half + SPACING.perimOpen, "to fit the extra tables.");
      placeGrid(venue.w/2, rowY + (rows-1)*fit.py/2, fit, remaining).forEach(p => slots.push(p));
    }
  } else if (tableCount){
    /* open canvas: grow it if needed rather than squeezing the spacing */
    const m = 2*SPACING.perimOpen;
    let fit = fitFor(venue.w - m, venue.h - m, tableKey, tableCount, perTable);
    if (fit.cap < tableCount){
      const half = halfExtent(tableKey, perTable);
      const step = 2*half + RULES.ideal;
      const nx = Math.max(1, Math.round(Math.sqrt(tableCount * venue.w / venue.h)));
      const ny = Math.ceil(tableCount / nx);
      growTo(nx*step + m, ny*step + m, "so the tables have proper aisles.");
      fit = fitFor(venue.w - m, venue.h - m, tableKey, tableCount, perTable);
    }
    if (fit.lane < RULES.ideal) tight = true;
    const n = Math.min(tableCount, Math.max(fit.cap, 1));
    let put = null;
    if (floorOcc){
      /* keep the open-air tables clear of the dance floor too */
      const area = areaOfCanvas();
      for (const cand of [patPerimeter(area, fit, n), placeGrid(venue.w/2, venue.h/2, fit, n)]){
        if (!cand) continue;
        const keep = cand.filter(p => clearBetween(occupancy(tableKey, perTable, p), floorOcc) >= 1);
        if (keep.length === n){ put = cand; break; }
        if (!put || keep.length > put.length) put = keep;
      }
    }
    (put || placeGrid(venue.w/2, venue.h/2, fit, n)).forEach(p => slots.push(p));
    overflow += Math.max(0, tableCount - slots.length);
  }

  /* chairs across the tables */
  const cap = CAT[tableKey].max;
  let chairTotal = spec.chairs != null ? spec.chairs
                 : spec.guests != null ? spec.guests
                 : (spec.chairType ? slots.length * (CAT[tableKey].min || 0) : 0);
  if (CAT[tableKey].standing) chairTotal = 0;
  const per = slots.length ? distribute(chairTotal, slots.length, cap) : [];
  let seated = 0;
  slots.forEach((p, i) => {
    const it = newItem(tableKey, p.x, p.y);
    it.rot = p.rot;
    it.props.chairs = per[i] || 0;
    it.props.ctype = spec.chairType || "basic";
    if (spec.cloth) it.props.cloth = spec.cloth;
    seated += it.props.chairs;
    items.push(it);
  });
  if (floorItem) items.push(floorItem);

  render(); fitView(true);
  $("venueChip").textContent = `${venue.w} × ${venue.h} ft ✎`;

  /* read-back */
  const tentCounts = {};
  tents.forEach(k => tentCounts[k] = (tentCounts[k]||0)+1);
  for (const k in tentCounts) readback.push(`${tentCounts[k]} × ${CAT[k].size} tent`);
  const exNames = Object.keys(spec.extras).map(k => k==="lights" ? "string lights" : k==="walls" ? "walls"
    : k==="windows" ? "windows" : k==="ceil" ? "ceiling liner" : "leg liners");
  if (exNames.length && tents.length) readback.push(exNames.join(" + "));
  if (slots.length) readback.push(`${slots.length} × ${CAT[tableKey].short}`);
  if (floorItem) readback.push(`${CAT[floorItem.k].size} dance floor`);
  if (seated) readback.push(`${seated} ${CHAIRS[spec.chairType || "basic"].name.toLowerCase()}s`);
  if (spec.cloth && slots.length) readback.push(`spandex ${spec.cloth}`);

  if (chairTotal > seated) notes.unshift(`Seated ${seated} of ${chairTotal} — add a table or a bigger tent for the rest.`);
  if (overflow && tents.length){
    const seatsIn = tentSeats(tents[0], tableKey);
    if (floorItem){
      notes.unshift(`The ${CAT[floorItem.k].size} dance floor takes the middle of the ${CAT[tents[0]].size}, so ${overflow} of ${tableCount} table${tableCount>1?"s":""} ${overflow===1?"sits":"sit"} outside. A second tent would bring ${overflow===1?"it":"them"} under cover.`);
    } else {
      notes.unshift(`${overflow} table${overflow>1?"s":""} placed outside the tent — ${overflow>1?"they don't":"it doesn't"} fit inside with proper aisles. ` +
        (tents.length === 1 && seatsIn ? `A ${CAT[tents[0]].size} seats about ${seatsIn} at ${CAT[tableKey].short} tables.` : ""));
    }
  }
  if (tight && seated) notes.push(`Aisles are tighter than the ${SPACING.seated.ideal} ft of clear floor we'd normally leave between chairs — nothing overlaps, but it's snug.`);

  if (!readback.length){ rollback(); return toast("I didn’t catch any items — try “20×20 tent with 5 round tables and 40 chairs”."); }
  const shown = notes.slice(0, 2);
  toast(`<b>${readback.join(" · ")}</b> — ${money(quoteLines().total)}` +
        (shown.length ? `<br><span style="color:#dcd8c4;font-weight:500">${shown.join(" ")}</span>` : ""),
        {undo:true, ms: shown.length ? 9000 : 7000});
}

function runPrompt(text){
  const raw = (text ?? $("pin").value).trim();
  if (!raw) return $("pin").focus();
  $("pin").value = raw;
  $("pin").blur();
  const spec = parsePrompt(raw);
  if (!spec.any) return toast("I didn’t catch any items — try “20×20 tent with 5 round tables and 40 padded chairs”.");
  if (isModifyOnly(spec)) applyModify(spec); else applySpec(spec);
}
$("prun").addEventListener("click", () => runPrompt());
$("pin").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); runPrompt(); } });
$("exs").innerHTML = EXAMPLES.map(x => `<button class="ex" data-ex="${x.replace(/"/g,"&quot;")}">“${x}”</button>`).join("");
$("exs").addEventListener("click", e => {
  const b = e.target.closest("[data-ex]"); if (!b) return;
  $("pin").value = b.dataset.ex; runPrompt(b.dataset.ex);
});

/* ============ guided auto-arrange ============ */
$("autob").addEventListener("click", () => {
  const segRow = (name, opts, def) => `<div class="seg" data-seg="${name}">` + opts.map(o =>
    `<button class="mrow ${o.v===def?"on":""}" data-act="segpick" data-val="${o.v}">
      <span class="tick">✓</span>${o.l}</button>`).join("") + `</div>`;
  openSheet(`<h3>Auto arrange</h3><p class="sub">The guided version of the prompt box — four questions, then it replaces the layout.</p>
    <div class="fld"><label>How many guests?</label><input id="aG" type="number" inputmode="numeric" value="40"></div>
    <div class="seclbl">Table type</div>
    ${segRow("table", [{v:"r5",l:"5 ft round"},{v:"t6",l:"6 ft"},{v:"t8",l:"8 ft"}], "r5")}
    <div class="seclbl">Tent</div>
    ${segRow("tent", [{v:"none",l:"None"},{v:"auto",l:"Choose for me"},{v:"tt1010",l:"10×10"},{v:"tt1020",l:"10×20"},{v:"tt2020",l:"20×20"}], "auto")}
    <div class="seclbl">Chair type</div>
    ${segRow("chair", [{v:"basic",l:`Basic <span class="pr">$1.80</span>`},{v:"padded",l:`Padded white <span class="pr">$3</span>`}], "basic")}
    <button class="cta" data-act="autoRun">Arrange it ✨</button>`, {type:"auto"});
});
function runAuto(){
  const g = Math.max(1, +$("aG").value || 0);
  const pick = n => document.querySelector(`[data-seg="${n}"] .mrow.on`).dataset.val;
  const tKey = pick("table"), tentSel = pick("tent"), chair = pick("chair");
  const spec = {venue:null, tents: tentSel==="none"||tentSel==="auto" ? [] : [tentSel],
                tentAuto: tentSel==="auto", tentCount:1,
                tables:[{key:tKey, n:null}], chairs:g, chairType:chair, cloth:null,
                extras:{}, guests:g, notes:[], any:true};
  closeSheet();
  applySpec(spec);
}

/* ============ tray ============ */
function trayThumb(k){
  const c = CAT[k];
  if (k === "dfPick") return `<svg viewBox="-11 -7 22 14"><rect x="-7" y="-4.5" width="14" height="9" rx=".6" fill="var(--floor)" stroke="var(--floor-edge)" stroke-width=".5"/><line x1="-2.3" y1="-4.5" x2="-2.3" y2="4.5" stroke="var(--floor-edge)" stroke-width=".3" opacity=".6"/><line x1="2.3" y1="-4.5" x2="2.3" y2="4.5" stroke="var(--floor-edge)" stroke-width=".3" opacity=".6"/><line x1="-7" y1="0" x2="7" y2="0" stroke="var(--floor-edge)" stroke-width=".3" opacity=".6"/></svg>`;
  if (c.cat==="tent") return `<svg viewBox="-11 -7 22 14"><rect x="${-c.w/4}" y="${-c.h/4}" width="${c.w/2}" height="${c.h/2}" rx=".4" fill="var(--tent-fill)" stroke="var(--tent-edge)" stroke-width=".5"/></svg>`;
  if (c.shape==="round") return `<svg viewBox="-5 -3 10 6"><circle r="${c.d/2*0.9}" fill="var(--wood)" stroke="var(--wood-edge)" stroke-width=".25" transform="scale(1 .85)"/></svg>`;
  return `<svg viewBox="-6 -3 12 6"><rect x="${-c.w/2*0.9}" y="-1.1" width="${c.w*0.9}" height="2.2" rx=".2" fill="var(--wood)" stroke="var(--wood-edge)" stroke-width=".22"/></svg>`;
}
$("trayRow").innerHTML = TRAY.map(k => k === "dfPick"
  ? `<button class="titem" data-pick="floor">${trayThumb(k)}<b>Dance floor</b><span>pick size</span></button>`
  : `<button class="titem" data-add="${k}">${trayThumb(k)}<b>${CAT[k].name}</b><span>${money(CAT[k].price)}</span></button>`).join("");
$("trayRow").addEventListener("click", e => {
  if (e.target.closest("[data-pick='floor']")) return openFloorPicker(null);
  const b = e.target.closest("[data-add]"); if (!b) return;
  commit();
  const it = newItem(b.dataset.add, Math.round(view.x + view.w/2), Math.round(view.y + viewH()/2));
  items.push(it); sel = new Set([it.id]); render();
});

/* ============ pointer interaction ============ */
const ptrs = new Map();
let drag = null, pressT = null, pinch0 = null;
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x: view.x + (e.clientX-r.left)/r.width*view.w,
          y: view.y + (e.clientY-r.top)/r.height*viewH()};
}
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  clearTimeout(pressT); pressT = null;
  if (ptrs.size === 2){
    drag = null;
    const [a,b] = [...ptrs.values()];
    pinch0 = {d: Math.hypot(a.x-b.x, a.y-b.y), w: view.w,
              mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vx:view.x, vy:view.y};
    return;
  }
  const hit = e.target.closest("[data-id]");
  const additive = e.shiftKey || e.metaKey || e.ctrlKey;
  if (hit){
    const it = items.find(i => i.id === +hit.dataset.id);
    if (!it) return;
    if (selectMode || additive){
      sel.has(it.id) ? sel.delete(it.id) : sel.add(it.id);
      renderSel();
      if (!sel.has(it.id)) { drag = null; return; }
    } else if (!sel.has(it.id)){
      sel = new Set([it.id]);
    }
    renderSel();
    const origins = new Map();
    items.filter(i => sel.has(i.id)).forEach(i => origins.set(i.id, {x:i.x, y:i.y}));
    drag = {type:"item", origins, sx:e.clientX, sy:e.clientY, moved:false};
    if (sel.size === 1) pressT = setTimeout(() => { drag = null; menuFor(it.id); }, 480);
  } else if (selectMode || additive){
    const w = toWorld(e);
    drag = {type:"marquee", sx:e.clientX, sy:e.clientY, moved:false};
    marquee = {x0:w.x, y0:w.y, x1:w.x, y1:w.y};
    if (!additive) sel.clear();
    renderSel();
  } else {
    drag = {type:"pan", sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:false};
    sel.clear(); renderSel();
  }
});
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch0){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    const r = cv.getBoundingClientRect();
    const nw = Math.min(400, Math.max(8, pinch0.w * pinch0.d/d));
    const wx = pinch0.vx + (pinch0.mx-r.left)/r.width * pinch0.w;
    const wy = pinch0.vy + (pinch0.my-r.top)/r.height * (pinch0.w*r.height/r.width);
    view.w = nw;
    view.x = wx - (pinch0.mx-r.left)/r.width * nw;
    view.y = wy - (pinch0.my-r.top)/r.height * (nw*r.height/r.width);
    applyView(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx,dy) > 7){
    drag.moved = true; clearTimeout(pressT); pressT = null;
    if (drag.type === "item") commit();   // one history entry per drag
  }
  if (!drag.moved) return;
  const r = cv.getBoundingClientRect(), s = view.w / r.width;
  if (drag.type === "pan"){
    view.x = drag.vx - dx*s; view.y = drag.vy - dy*s; applyView();
  } else if (drag.type === "marquee"){
    const w = toWorld(e);
    marquee.x1 = w.x; marquee.y1 = w.y;
    renderSel();
  } else {
    const snap = v => Math.round(v*2)/2;
    const ddx = snap(dx*s), ddy = snap(dy*s);
    for (const [id, o] of drag.origins){
      const it = items.find(i => i.id===id);
      if (it){ it.x = o.x + ddx; it.y = o.y + ddy; }
    }
    render();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = null;
  clearTimeout(pressT); pressT = null;
  if (marquee){
    const x0 = Math.min(marquee.x0, marquee.x1), x1 = Math.max(marquee.x0, marquee.x1);
    const y0 = Math.min(marquee.y0, marquee.y1), y1 = Math.max(marquee.y0, marquee.y1);
    if (Math.abs(x1-x0) > .6 || Math.abs(y1-y0) > .6){
      for (const it of items){
        const b = itemBox(it);
        if (b.x1 >= x0 && b.x0 <= x1 && b.y1 >= y0 && b.y0 <= y1) sel.add(it.id);
      }
    }
    marquee = null; renderSel();
  }
  drag = null;
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("contextmenu", e => {
  e.preventDefault();
  const hit = e.target.closest("[data-id]");
  if (hit) menuFor(+hit.dataset.id);
});

/* pill + bulk actions */
const selItems = () => items.filter(i => sel.has(i.id));
function actRotate(){
  const list = selItems(); if (!list.length) return;
  commit();
  list.forEach(it => it.rot = (it.rot + (CAT[it.k].cat==="tent" ? 90 : 45)) % 360);
  render();
}
function actDuplicate(){
  const list = selItems(); if (!list.length) return;
  commit();
  const made = [];
  for (const it of list){
    const n = newItem(it.k, it.x + 3, it.y + 3);
    n.rot = it.rot;
    n.props = JSON.parse(JSON.stringify(it.props));
    items.push(n); made.push(n.id);
  }
  sel = new Set(made); render();
  if (made.length > 1) toast(`Duplicated ${made.length} items with all their properties`, {undo:true});
}
function actDelete(){
  const list = selItems(); if (!list.length) return;
  commit();
  const n = list.length;
  items = items.filter(i => !sel.has(i.id));
  sel.clear(); render();
  if (n > 1) toast(`Deleted ${n} items`, {undo:true});
}
function duplicate(it){ sel = new Set([it.id]); actDuplicate(); }

$("pRot").addEventListener("click", actRotate);
$("pDup").addEventListener("click", actDuplicate);
$("pMenu").addEventListener("click", () => { const l = selItems(); if (l.length===1) menuFor(l[0].id); });
$("pDel").addEventListener("click", actDelete);

$("selBtn").addEventListener("click", () => {
  selectMode = !selectMode;
  $("selBtn").classList.toggle("on", selectMode);
  if (!selectMode) sel.clear();
  renderSel();
  if (selectMode) toast("Tap items to select · drag across the canvas to lasso · two fingers to pan<br><span style='color:#dcd8c4;font-weight:500'>On a keyboard, hold Shift or ⌘ and drag to lasso any time.</span>", {ms:5000});
});
$("multibar").addEventListener("click", e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  const m = b.dataset.m;
  if (m === "all"){ sel = new Set(items.map(i => i.id)); renderSel(); return; }
  if (m === "props"){ const l = selItems(); if (l.length === 1) menuFor(l[0].id); return; }
  if (m === "dup") return actDuplicate();
  if (m === "rot") return actRotate();
  if (m === "del") return actDelete();
  if (m === "done"){
    selectMode = false; $("selBtn").classList.remove("on"); sel.clear(); renderSel();
  }
});

/* zoom */
function zoomBy(f){
  const cxw = view.x + view.w/2, cyw = view.y + viewH()/2;
  view.w = Math.min(400, Math.max(8, view.w*f));
  view.x = cxw - view.w/2; view.y = cyw - viewH()/2; applyView();
}
$("zin").addEventListener("click", () => zoomBy(1/1.35));
$("zout").addEventListener("click", () => zoomBy(1.35));
$("zfit").addEventListener("click", () => fitView(items.length > 0));
window.addEventListener("resize", applyView);

/* undo / redo */
$("undoBtn").addEventListener("click", () => {
  undo() ? toast("Undone" + (future.length > 1 ? ` · ${past.length} step${past.length===1?"":"s"} left` : ""), {ms:1800})
         : toast("Nothing to undo", {ms:1600});
});
$("redoBtn").addEventListener("click", () => {
  redo() ? toast("Redone", {ms:1800}) : toast("Nothing to redo", {ms:1600});
});
window.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;    // let the prompt box own ⌘Z
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (k === "y"){ e.preventDefault(); redo(); }
});

/* keep the app inside the visible viewport when the keyboard opens */
if (window.visualViewport){
  const vv = window.visualViewport, app = $("app");
  const fix = () => { app.style.height = vv.height + "px"; window.scrollTo(0,0); applyView(); };
  vv.addEventListener("resize", fix);
  vv.addEventListener("scroll", fix);
}

render(); fitView();
</script>
